<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — My Online Home</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;0,700&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --cream:#f5f0e8; --forest:#2d4a3e; --sage:#7a9e8e; --rust:#c4622d; --mid-grey:#7a7a7a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',-apple-system,sans-serif; background:var(--cream);
         color:#2a2a2a; min-height:100vh; display:flex; align-items:center;

  h1 { font-family:'Playfair Display',Georgia,serif; font-size:clamp(2.4rem,7vw,3.6rem);
       color:var(--forest); letter-spacing:-0.02em; margin-bottom:0.6rem; }
  .quip { font-family:'Playfair Display',Georgia,serif; font-style:italic;
          color:var(--sage); font-size:1.1rem; margin-bottom:1.6rem; }
  p { color:var(--mid-grey); max-width:38ch; margin:0 auto 2rem; }
  a { color:var(--rust); text-decoration:none; font-weight:400; border-bottom:1px solid rgba(196,98,45,0.3); }

  <div>
