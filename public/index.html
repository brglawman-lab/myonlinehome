<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Online Home</title>
<meta name="description" content="Ben Lawman — recipes, food storage, West Yorkshire food markets, and wildlife photography.">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --forest: #2d4a3e;
    --sage: #7a9e8e;
    --rust: #c4622d;
    --mid-grey: #7a7a7a;
    --light-border: rgba(45,74,62,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--cream);
    color: var(--forest);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem 1.5rem;
  }
  a { color: inherit; text-decoration: none; }

  .wordmark {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.2em;
    color: var(--sage); font-weight: 500; margin-bottom: 3rem;
  }
  .choices { display: flex; flex-direction: column; align-items: center; gap: 1.25rem; }
  .choice {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(3rem, 12vw, 5.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    padding: 0.15em 0.3em;
    border-radius: 10px;
    transition: color 0.18s ease, transform 0.18s ease;
  }
  .choice:hover, .choice:focus-visible { transform: translateY(-2px); outline: none; }
  .choice.food:hover, .choice.food:focus-visible { color: var(--rust); }
  .choice.photos:hover, .choice.photos:focus-visible { color: var(--sage); }

  footer {
    margin-top: 4rem;
    text-align: center; font-size: 0.78rem; color: var(--mid-grey);
  }
  footer a { color: var(--forest); border-bottom: 1px solid var(--light-border); }

  @media (max-width: 480px) {
    .wordmark { margin-bottom: 2rem; }
    .choices { gap: 0.75rem; }
  }
</style>
</head>
<body>

<p class="wordmark">My Online Home</p>

<div class="choices">
  <a class="choice food" href="/food/">Food</a>
  <a class="choice photos" href="/photos/">Photos</a>
</div>

<footer>
  Built and maintained with Claude
</footer>

</body>
</html>
