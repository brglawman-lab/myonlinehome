<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Storage — Chef Claude</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F7F4EF; --surface: #FFFFFF; --surface2: #F0EDE7;
    --border: #E2DDD5; --border-strong: #C8C2B8;
    --text: #1A1714; --text-muted: #7A7470; --text-faint: #B0AAA4;
    --accent: #2C5F2E; --accent-light: #EAF0EA; --accent-text: #1A3D1B;
    --red: #8B2E2E; --red-light: #F5EAEA;
    --amber: #8B5E1A; --amber-light: #FBF2E3;
    --blue: #1A3D6B; --blue-light: #E8EEF5;
    --teal: #1A5050; --teal-light: #E5F0F0;
    --pink: #6B2A4A; --pink-light: #F5EAF0;
    --radius: 4px; --radius-lg: 8px;
    --header-h: 64px;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.6; }

  /* ---- header, matched to the recipe book ---- */
  .site-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; position: sticky; top: 0; z-index: 50; }
  .header-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: var(--header-h); gap: 1.5rem; }
  .logo { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--text); white-space: nowrap; flex-shrink: 0; }
  .logo span { color: var(--accent); font-style: italic; }

  .main { max-width: 1100px; margin: 0 auto; padding: 2rem 2rem 5rem; }
  .intro { margin-bottom: 1.5rem; }
  .intro h1 { font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 400; line-height: 1.2; margin-bottom: 0.4rem; }
  .intro p { color: var(--text-muted); max-width: 68ch; }

  /* ---- tabs ---- */
  .tab-bar { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
  .tab-btn { background: none; border: none; padding: 10px 4px; margin-right: 20px; font-family: 'DM Sans', sans-serif; font-size: 14.5px; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s; }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent-text); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ---- shared ---- */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem 1.25rem 1.35rem; margin-bottom: 1.5rem; }
  .panel-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 0.6rem; }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; letter-spacing: 0.04em; text-transform: uppercase; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); background: var(--bg); outline: none; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--border-strong); background: white; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-row.three { grid-template-columns: 1fr 1fr 1fr; }
  .form-hint { font-size: 12px; color: var(--text-faint); margin-top: 3px; }
  .btn { padding: 9px 16px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; white-space: nowrap; }
  .btn:hover { opacity: 0.88; }
  .btn.secondary { background: none; border: 1px solid var(--border-strong); color: var(--text); }
  .btn.danger { background: none; border: 1px solid var(--red); color: var(--red); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .icon-btn { background: none; border: none; color: var(--text-faint); cursor: pointer; padding: 5px; border-radius: var(--radius); display: inline-flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: var(--surface2); color: var(--text); }

  /* ---- modal (shared by ingredient detail + room/reading forms) ---- */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(20,16,12,0.5); z-index: 200; align-items: flex-start; justify-content: center; padding: 2rem 1rem; overflow-y: auto; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); width: 100%; max-width: 560px; padding: 1.75rem; position: relative; margin: auto; }
  .modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-faint); line-height: 1; padding: 4px; }
  .modal-close:hover { color: var(--text); }
  .modal h2 { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 400; margin: 0 1.5rem 4px 0; line-height: 1.3; }
  .modal-meta { font-size: 12px; color: var(--text-faint); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 1.25rem; }
  .guide-row { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; line-height: 1.55; }
  .guide-row:last-child { border-bottom: none; }
  .guide-row .g-label { min-width: 96px; flex-shrink: 0; font-weight: 500; color: var(--blue); }
  .used-in { margin-top: 1rem; padding-top: 0.85rem; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--text-muted); }
  .used-in strong { color: var(--text); font-weight: 500; }

  /* ---- ingredients tab ---- */
  .ing-search { margin-bottom: 1rem; position: relative; max-width: 420px; }
  .ing-search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
  .ing-search input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); outline: none; transition: border-color 0.15s; }
  .ing-search input:focus { border-color: var(--accent); }
  .ing-count { font-size: 12px; color: var(--text-faint); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 0.85rem; }
  .ing-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .ing-card { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: border-color 0.15s, background 0.15s; }
  .ing-card:hover { border-color: var(--border-strong); background: var(--surface2); }
  .ing-card .ing-name { font-size: 14px; color: var(--text); text-transform: capitalize; }
  .ing-card .ing-cat { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .empty { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }

  @media (max-width: 640px) {
    .site-header, .main { padding-left: 1rem; padding-right: 1rem; }
    .intro h1 { font-size: 27px; }
    .form-row, .form-row.three { grid-template-columns: 1fr; }
    .ing-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
</style>
</head>

padding:7px 14px;border-radius:999px;background:rgba(250,248,244,0.96);color:#2d4a3e;
font:500 13px/1.2 'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
text-decoration:none;border:1px solid rgba(45,74,62,0.22);
box-shadow:0 2px 12px rgba(0,0,0,0.16);backdrop-filter:blur(6px);

<header class="site-header">
  <div class="header-inner">
    <div class="logo">Recipe <span>Book</span></div>
  </div>
</header>

<nav class="recipe-nav" id="recipeNav" data-current="storage"></nav>
<script src="/assets/recipe-nav.js"></script>

<main class="main">
  <div class="intro">
    <h1>Food Storage</h1>
    <p>Look up how to store any ingredient in the book once it's opened.</p>
  </div>

  <section class="tab-panel active" id="panelIngredients">
    <div class="ing-search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6.5" cy="6.5" r="5"></circle><path d="M11 11l3 3"></path></svg>
      <input type="text" id="ingSearch" aria-label="Search ingredients" placeholder="Search ingredients…" oninput="renderIngredients()">
    </div>

  <div class="modal" id="detailModal"></div>
</div>

<script>
/* ===========================================================================
 * Food Storage — ingredient lookup.
 *
 * Ingredients tab: pulls the same recipe list the recipe book and Meal
 * Builder use (/recipes/recipes.json, merged with the database
 * overlay), lists every distinct ingredient, and matches each one against a
 * hand-built storage guide — general food-safety guidance (UK FSA-style),
 * not brand- or product-specific advice.
 *
 * The room temperature/humidity tracker that used to be a second tab here
 * is now at /admin/storage/, behind the sign-in.
 * ======================================================================== */

function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }


function closeModal(e) {
  if (!e || e.target === document.getElementById('detailOverlay')) {
    document.getElementById('detailOverlay').classList.remove('open');
  }
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.getElementById('detailOverlay').classList.remove('open'); });

/* ---------------------------------------------------------------------------
 * Ingredient storage guide
 *
 * General received wisdom, not tied to any particular brand or product.
 * Categories are checked in order and the first match wins, so more specific
 * entries (an exclusion, or a narrower phrase like "sour cream") are listed
 * before broader ones they'd otherwise be swallowed by ("cream").
 * ------------------------------------------------------------------------- */
const INGREDIENT_GUIDE = [
  { label: 'Fresh pasta & noodles', match: ['fresh egg noodles', 'fresh pasta', 'fresh noodles', 'fresh ramen'], rows: [
    ['Unopened', 'Perishable, not a pantry item — check the use-by date on the pack.'],
    ['Once opened', 'Reseal tightly and refrigerate.'],
    ['Fridge', 'Use within 2–3 days of opening, or by the use-by date if sooner.'],
    ['Freezer', 'Freezes well for up to 3 months — portion it first so you only thaw what you need.'],
  ]},
  { label: 'Dried pasta & noodles', match: ['pasta', 'macaroni', 'orzo', 'spaghetti', 'tagliatelle', 'penne', 'fusilli', 'noodles', 'vermicelli', 'linguine', 'lasagne'], rows: [
    ['Unopened', 'Check the best-before date — dried pasta and noodles keep well past it if stored somewhere cool and dry.'],
    ['Once opened', "Reseal the bag tightly (a clip works, or decant into an airtight container) and keep in a cool, dry cupboard. It's good for 1–2 years — the real risks are moisture (turns it soft or mouldy) and pantry pests, not time."],
    ['Fridge / Freezer', "Not needed. Freezing dry pasta or noodles gives no benefit — a sealed cupboard is fine indefinitely as long as it stays dry."],
  ]},
  { label: 'Rice (uncooked)', match: ['rice'], exclude: ['vinegar', 'wine', 'noodle', 'paper'], rows: [
    ['Unopened', 'Check the best-before date; well-stored rice keeps well beyond it.'],
    ['Once opened', 'Transfer to an airtight container — this keeps out moisture and pantry moths. White rice keeps 1–2 years; brown rice has more natural oils and turns rancid sooner, so use it within about 6 months of opening for best flavour.'],
    ['Cooked rice — take care', 'Cool it within an hour of cooking, keep it no more than a day in the fridge, and reheat until steaming hot throughout. Spores that survive cooking can multiply at room temperature, which is why rice is treated more cautiously than most leftovers.'],
  ]},
  { label: 'Dried pulses, lentils & beans', match: ['dried lentil', 'split peas', 'dried chickpea', 'dried beans', 'dried pulses', 'lentils'], exclude: ['tinned', 'canned', 'drained'], rows: [
    ['Unopened / opened', 'Keep sealed in a cool, dry cupboard — they last well over a year. Older pulses take longer to cook and soften rather than becoming unsafe, so use the oldest stock first.'],
  ]},
  { label: 'Cornflour', match: ['cornflour'], rows: [
    ['Unopened / opened', "Keep sealed in a dry cupboard — it doesn't really spoil, just clumps if it gets damp. Good for a year or more once opened."],
  ]},
  { label: 'Flour', match: ['flour'], rows: [
    ['Unopened', 'Check the best-before date.'],
    ['Once opened', 'Reseal or decant into an airtight container and keep in a cool, dry cupboard.'],
    ['How long', 'White flours keep 6–12 months once opened. Wholemeal flour has more natural oils and turns rancid faster — use within about 3 months of opening.'],
    ['Fridge / Freezer', 'Not needed, but freezing pauses spoilage entirely and helps stop flour weevils in a warm kitchen — handy if you buy in bulk.'],
  ]},
  { label: 'Sugar', match: ['sugar'], rows: [
    ["Doesn't spoil", 'Keep opened bags sealed in a cool, dry place — moisture (clumping) and strong nearby odours are the only real risks.'],
    ['Brown sugar', 'Dries out and hardens once opened; keep it airtight, or add a slice of bread or an apple wedge to the container to keep it soft.'],
  ]},
  { label: 'Raising agents (baking powder, bicarbonate of soda)', match: ['baking powder', 'bicarbonate of soda', 'baking soda'], rows: [
    ['Once opened', 'Keep the lid tight in a dry cupboard. It loses potency rather than spoiling outright — usually good for 12–18 months after opening. If in doubt, stir a teaspoon into water: it should fizz.'],
  ]},
  { label: 'Yeast', match: ['yeast'], rows: [
    ['Dried, unopened', 'Keeps until the best-before date in a cool cupboard.'],
    ['Dried, opened', 'Reseal tightly and refrigerate; keeps a few months in the fridge, or freeze for up to a year.'],
    ['Fresh yeast', 'Keep refrigerated and use within 1–2 weeks, or freeze in small portions for up to 3 months.'],
  ]},
  { label: 'Ground spices & spice blends', match: ['cumin', 'paprika', 'cayenne', 'nutmeg', 'turmeric', 'curry powder', 'ground ginger', 'chilli flakes', 'garlic granules', 'shawarma spice', 'spice blend', 'chiles de árbol', 'dried red chillies'], rows: [
    ['Storage', "Keep in a sealed jar away from heat, light and steam — not on a shelf right above the hob."],
    ['How long', "Ground spices don't really \"go off\" so much as fade: expect 6–12 months of good potency and colour after opening, longer if kept somewhere cool and dark. Whole spices (peppercorns, whole cumin) keep well for 2–3 years."],
  ]},
  { label: 'Salt', match: ['salt'], exclude: ['salted', 'saltiness'], rows: [
    ["Doesn't spoil", 'Keep sealed away from moisture — the only real issue is clumping in humid air. No best-before date worth worrying about.'],
  ]},
  { label: 'Water', match: ['water'], rows: [
    ['No storage needed', 'Use straight from the tap (or kettle, for hot/lukewarm water) — nothing to store here.'],
  ]},
  { label: 'Anchovies & sundried tomatoes (oil-packed)', match: ['anchovy', 'anchovies', 'sundried tomato'], rows: [
    ['Once opened', 'Keep submerged in their oil in a sealed container in the fridge — the oil and salt do most of the preserving. Use within 1–2 months, topping up with a little extra oil if needed to keep everything covered.'],
  ]},
  { label: 'Fresh herbs', match: ['fresh coriander', 'fresh dill', 'fresh mint', 'fresh parsley', 'flat-leaf parsley', 'rosemary', 'thyme', 'chives'], exclude: ['dried'], rows: [
    ['Fridge', 'Wrap loosely in damp kitchen paper, or stand woody stems (rosemary, thyme) in a glass of water — either way, use within about a week.'],
    ['Freezer', 'Chop and freeze in ice-cube trays with a little water or oil; great for cooking, not for garnish.'],
  ]},
  { label: 'Dried herbs & bay leaves', match: ['dried oregano', 'bay leaves', 'bouquet garni', 'dried thyme'], rows: [
    ['Storage', 'Keep sealed in a cool, dark cupboard. Dried herbs fade in flavour well before they become unsafe — expect the best aroma in the first 6–12 months after opening.'],
  ]},
  { label: 'Cooking oils', match: ['olive oil', 'vegetable oil', 'groundnut oil', 'rapeseed oil', 'sunflower oil', 'toasted sesame oil', 'high-smoke-point oil', 'oil'], rows: [
    ['Storage', 'Keep sealed, away from direct heat and light — a cupboard, not next to the hob or on a sunny windowsill. Warmth and light are what turn oil rancid, not time alone.'],
    ['How long', "Most cooking oils are best for flavour within 3–6 months of opening, though they stay safe well beyond that — a rancid, \"crayon-like\" smell is the sign to bin it. Extra virgin olive oil and nut or sesame oils are more delicate and best used within a couple of months of opening."],
    ['Fridge', "Not needed for everyday cooking oil (and can turn olive oil cloudy, which is harmless and clears at room temperature). Nut and sesame oils benefit from the fridge once opened."],
  ]},
  { label: 'Vinegar', match: ['vinegar'], rows: [
    ['Storage', "Vinegar's acidity makes it essentially self-preserving. Keep the cap on in a cool cupboard — no need to refrigerate — and it will keep for 1–2 years after opening with little more than a gradual loss of aroma."],
  ]},
  { label: 'Tinned & canned goods', match: ['black beans', 'chickpeas', 'cannellini beans', 'butter beans', 'crushed tomatoes', 'tinned tomatoes', 'tinned coconut milk', 'tuna, drained', 'coconut milk'], rows: [
    ['Unopened', 'Keeps for 1–2+ years past the best-before date if the tin is undamaged (no dents, rust or bulging) — the date is about quality, not sudden spoilage.'],
    ['Once opened', 'Never leave food in the tin — decant into a sealed container or bowl and refrigerate. Beans, pulses, tomatoes and coconut milk all keep for about 2–3 days this way.'],
    ['Freezer', 'Beans, pulses, coconut milk and tomato sauces all freeze well for up to 3 months. Coconut milk separates on thawing — just whisk it back together.'],
  ]},
  { label: 'Tomato paste / purée', match: ['tomato paste', 'tomato purée', 'tomato puree'], rows: [
    ['A tube', "Keeps for several months in the fridge once opened — that's what the resealable cap is for."],
    ['From a tin', "Decant and refrigerate for 2–3 days, or freeze small dollops (a teaspoon at a time, or frozen flat in a bag and snapped into pieces) so a spoonful is always on hand without wasting the rest."],
  ]},
  { label: 'Salty & savoury sauces (soy, fish sauce, Worcestershire, sriracha)', match: ['soy sauce', 'fish sauce', 'worcestershire', 'sriracha', 'shaoxing', 'oyster sauce', 'sweet chilli sauce', 'pad thai paste', 'pickle juice'], rows: [
    ['Storage', "High salt or acid content makes these self-stable for a long time. Most keep their quality for 6–12+ months after opening in a cool cupboard, though the fridge door is fine too and is what some labels ask for — check fish sauce and pad thai paste in particular."],
  ]},
  { label: 'Mustard', match: ['mustard'], rows: [
    ['Storage', 'Keeps in the fridge (or a cool cupboard) for up to a year once opened — mustard rarely spoils, though it mellows and fades in pungency over time.'],
  ]},
  { label: 'Mayonnaise', match: ['mayo', 'mayonnaise'], rows: [
    ['Storage', 'Always refrigerate after opening. Being egg-based, it is less forgiving than most condiments if left out — use within about 2 months of opening, or by the date on the jar if sooner.'],
  ]},
  { label: 'Curry paste, harissa & chilli pastes', match: ['curry paste', 'harissa', 'chipotle', 'red curry paste'], rows: [
    ['Storage', 'Refrigerate once opened and use within a few weeks (check the jar).'],
    ['Freezer', 'Freezes well in small portions — an ice-cube tray works well — so a spoonful is always ready without the rest going to waste.'],
  ]},
  { label: 'Tahini & nut butters', match: ['tahini', 'peanut butter'], rows: [
    ['Storage', 'Keep in a cool cupboard, tightly sealed. The oil separates on standing — give it a good stir before use, or store the jar upside down occasionally to help redistribute it.'],
    ['How long', 'Keeps for months once opened. Refrigerating slows separation but makes it firmer to stir.'],
  ]},
  { label: 'Honey', match: ['honey'], rows: [
    ["Doesn't spoil", 'Keep the jar sealed at room temperature. Refrigerating actually speeds up crystallisation; if it crystallises, stand the jar in warm water to bring it back to liquid.'],
  ]},
  { label: 'Pickles, capers & jarred vegetables', match: ['capers', 'cornichons', 'pickle,', 'jalapeñ', 'gherkin'], rows: [
    ['Storage', 'The brine is doing the preserving. Keep the jar topped up with brine, lid on, in the fridge once opened — it will keep for several weeks to a few months.'],
  ]},
  { label: 'Jams, jellies & chutneys', match: ['redcurrant jelly', 'jam', 'chutney'], rows: [
    ['Storage', 'Refrigerate once opened, even if the label doesn\'t insist on it, and use within a few weeks to a couple of months. High-sugar jams are more forgiving than low-sugar or fresh-fruit ones.'],
  ]},
  { label: 'Stock cubes & concentrate', match: ['stock cube', 'made from concentrate', 'bouillon'], rows: [
    ['Unopened', 'Shelf-stable in the cupboard for a long time.'],
    ['Once opened (jars)', 'Refrigerate concentrate jars and use within the timeframe on the label — typically a few months.'],
  ]},
  { label: 'Liquid stock', match: ['beef stock', 'chicken stock', 'vegetable stock', 'chicken or vegetable stock'], rows: [
    ['Unopened (carton)', 'Keeps in the cupboard until its best-before date.'],
    ['Opened, or homemade', 'Refrigerate and use within 3–4 days.'],
    ['Freezer', 'Freezes well in portions (ice-cube trays or bags) for up to 3 months.'],
  ]},
  { label: 'Milk', match: ['milk'], exclude: ['coconut milk'], rows: [
    ['Fridge', 'Keep refrigerated at all times. Once opened, use within about 5–7 days or by the use-by date, whichever comes first — trust your nose over the date once it\'s open.'],
    ['Freezer', "Freezes reasonably well for up to 3 months if you won't get through it — expect some texture change, which is fine for cooking or baking."],
  ]},
  { label: 'Sour cream & crème fraîche', match: ['sour cream', 'soured cream', 'crème fraîche', 'creme fraiche'], rows: [
    ['Fridge', 'Refrigerate and use within about a week of opening.'],
    ['Freezer', "Not suitable — the texture splits badly on thawing."],
  ]},
  { label: 'Cream', match: ['double cream', 'cream'], exclude: ['sour', 'soured', 'crème fraîche', 'creme fraiche', 'ice cream'], rows: [
    ['Fridge', 'Refrigerate and use within 3–5 days of opening, or by the use-by date if sooner.'],
    ['Freezer', "Un-whipped double cream (high fat) freezes reasonably for up to 2 months, though it can separate slightly on thawing — best reserved for cooking rather than serving neat. Already-whipped cream doesn't freeze well."],
  ]},
  { label: 'Yoghurt', match: ['yogurt', 'yoghurt'], rows: [
    ['Fridge', 'Refrigerate and use within about a week of opening, or by the use-by date.'],
    ['Freezer', 'Can be frozen, though it turns grainy on thawing — best used in smoothies or cooking rather than eaten plain.'],
  ]},
  { label: 'Butter', match: ['butter'], exclude: ['butter beans', 'peanut butter'], rows: [
    ['Fridge', 'Keep refrigerated; well-wrapped butter keeps for several weeks past opening.'],
    ['Freezer', 'Freezes very well for 6–9 months — handy to buy in bulk when on offer.'],
  ]},

function matchIngredientCategory(rawItem) {
  const text = String(rawItem || '').toLowerCase();
  for (const cat of INGREDIENT_GUIDE) {
    if (cat.exclude && cat.exclude.some((x) => text.includes(x))) continue;
    if (cat.match.some((k) => text.includes(k))) return cat;
  }
  return null;
}

function fallbackGuidance(rawItem) {
  const t = String(rawItem || '').toLowerCase();
  if (t.includes('dried')) {
    return { label: 'Dry goods (general)', rows: [
      ['Storage', 'Keep sealed in a cool, dry cupboard away from heat and light. Once opened, reseal tightly or decant into an airtight container — moisture and pantry pests are the main risks for dry goods, not time itself.'],
    ]};
  }
  if (t.includes('tinned') || t.includes('canned')) {
    return { label: 'Tinned / canned (general)', rows: [
      ['Unopened', 'Keeps well past its best-before date if the tin is undamaged.'],
      ['Once opened', 'Never store food in the tin — decant into a sealed container and refrigerate, using within 2–3 days.'],
    ]};
  }
  if (t.includes('fresh')) {
    return { label: 'Fresh produce (general)', rows: [
      ['Fridge', 'Refrigerate and use within about a week — sooner for anything leafy or delicate.'],
      ['Freezer', "Many vegetables freeze well once blanched; fruit and salad vegetables eaten raw generally don't."],
    ]};
  }
  return { label: 'No specific entry yet', rows: [
    ['General rule of thumb', "Follow any instructions on the packaging. Once opened, most part-used ingredients are safest kept tightly sealed or wrapped in the fridge and used within 2–3 days — unless it's a shelf-stable dry good (flour, sugar, dried pasta, spices), in which case a cool, dry cupboard is fine."],
  ]};
}

/* ---------------------------------------------------------------------------
 * Loading the recipe list — same approach as the Meal Builder: read the
 * seed recipes from /recipes/recipes.json, then merge in
 * whatever the database holds, so anything added on the site shows up
 * here too with no extra work.
 * ------------------------------------------------------------------------- */
let RECIPES = [];

function extractArray(html, marker) {
  const at = html.indexOf(marker);
  if (at < 0) return null;
  const open = at + marker.length - 1;
  const close = html.indexOf('\n];', open);
  if (close < 0) return null;
  try { return (new Function('return ' + html.slice(open, close + 2) + ';'))(); }
  catch (e) { console.warn('Could not parse ' + marker, e); return null; }
}
function mergeById(base, overlay) {
  const map = new Map(base.map((r) => [r.id, r]));
  for (const r of overlay) map.set(r.id, r);
  return [...map.values()];
}
async function loadLibrary() {
  let seed = null;
  try {
    const res = await fetch('/recipes/recipes.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    seed = await res.json();
  } catch (e) {
    document.getElementById('ingCount').textContent = 'Could not read the recipe book.';
    return;
  }
  if (!Array.isArray(seed)) { document.getElementById('ingCount').textContent = 'The recipe book loaded but its recipe list could not be read.'; return; }

  let merged = seed;
  try {
    const [a, b] = await Promise.all([
      fetch('/api/recipes', { cache: 'no-store' }),
      fetch('/api/recipes/deleted', { cache: 'no-store' }),
    ]);
    if (a.ok) { const j = await a.json(); if (Array.isArray(j)) merged = mergeById(merged, j); }
    if (b.ok) { const j = await b.json(); if (Array.isArray(j)) { const gone = new Set(j); merged = merged.filter((r) => !gone.has(r.id)); } }
  } catch (e) { /* offline is fine — the seed is enough */ }

  RECIPES = merged.filter((r) => !r.noRecipe);
}

/* ---------------------------------------------------------------------------
 * Distinct ingredients across the book.
 * ------------------------------------------------------------------------- */
function normalizeIngredientKey(item) {
  let s = String(item || '').toLowerCase();
  s = s.replace(/\([^)]*\)/g, '');
  s = s.split(',')[0];
  s = s.trim().replace(/\s+/g, ' ');
  s = s.replace(/^(a|an|the)\s+/, '');
  return s;
}
let INGREDIENT_INDEX = [];
function buildIngredientIndex() {
  const map = new Map();
  for (const r of RECIPES) {
    for (const ing of r.ingredients || []) {
      const key = normalizeIngredientKey(ing.item);
      if (!key) continue;
      if (!map.has(key)) map.set(key, { key, label: key, recipeTitles: new Set(), matchText: ing.item });
      map.get(key).recipeTitles.add(r.title);
    }
  }
  INGREDIENT_INDEX = [...map.values()].sort((a, b) => a.key.localeCompare(b.key));
}
function renderIngredients() {
  const q = document.getElementById('ingSearch').value.toLowerCase().trim();
  const grid = document.getElementById('ingGrid');
  const empty = document.getElementById('ingEmpty');
  const count = document.getElementById('ingCount');
  const shown = INGREDIENT_INDEX.filter((i) => !q || i.key.includes(q));
  count.textContent = INGREDIENT_INDEX.length + ' ingredients from ' + RECIPES.length + ' recipes' + (q ? ' · ' + shown.length + ' shown' : '');
  if (!shown.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  grid.innerHTML = shown.map((i) => {
    const cat = matchIngredientCategory(i.matchText);
    const catLabel = cat ? cat.label : fallbackGuidance(i.matchText).label;
    return '<button class="ing-card" onclick="openIngredientDetail(\'' + i.key.replace(/'/g, "\\'") + '\')">'
      + '<div class="ing-name">' + escapeHtml(i.label) + '</div>'
      + '<div class="ing-cat">' + escapeHtml(catLabel) + '</div>'
      + '</button>';
  }).join('');
}
function openIngredientDetail(key) {
  const entry = INGREDIENT_INDEX.find((i) => i.key === key);
  if (!entry) return;
  const cat = matchIngredientCategory(entry.matchText) || fallbackGuidance(entry.matchText);
  const rowsHtml = cat.rows.map((row) => '<div class="guide-row"><span class="g-label">' + escapeHtml(row[0]) + '</span><span>' + escapeHtml(row[1]) + '</span></div>').join('');
  const titles = [...entry.recipeTitles].sort();
  const usedIn = '<div class="used-in"><strong>Used in ' + titles.length + ' recipe' + (titles.length !== 1 ? 's' : '') + ':</strong> ' + escapeHtml(titles.slice(0, 8).join(', ')) + (titles.length > 8 ? ', …' : '') + '</div>';
  const m = document.getElementById('detailModal');
  m.innerHTML = '<button class="modal-close" onclick="closeModal()">&#x2715;</button>'
    + '<h2>' + escapeHtml(entry.label) + '</h2>'
    + '<div class="modal-meta">' + escapeHtml(cat.label) + '</div>'
    + rowsHtml
    + usedIn;
  document.getElementById('detailOverlay').classList.add('open');
}

/* ---- init ---- */
(async function init() {
  await loadLibrary();
  buildIngredientIndex();
  renderIngredients();
})();
</script>
