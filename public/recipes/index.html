function loadRecipes() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      const storedArr = JSON.parse(stored);
      const defaultIds = new Set(DEFAULT_RECIPES.map(r => r.id));
      // File data always wins for recipes that exist in DEFAULT_RECIPES, so edits made to
      // this file (new fields, corrections, etc.) always show up. Only recipes added purely
      // through the browser's + Add form (not yet present in DEFAULT_RECIPES) are kept from storage.
      const result = DEFAULT_RECIPES.slice();
      storedArr.forEach(r => { if (!defaultIds.has(r.id)) result.push(r); });
      saveRecipesToStorage(result);
      return result;
    }
  } catch(e) {}
  saveRecipesToStorage(DEFAULT_RECIPES);
  return DEFAULT_RECIPES;
}
function saveRecipesToStorage(data) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {} }
let recipes = loadRecipes();

const SECTIONS_ORDER = [
  { id: 'starters',    label: 'Starters' },
  { id: 'fish',        label: 'Seafood' },
  { id: 'beef',        label: 'Beef' },
  { id: 'pork',        label: 'Pork' },
  { id: 'chicken',     label: 'Chicken' },
  { id: 'veg',         label: 'Veg' },
  { id: 'sides',       label: 'Sides' },
  { id: 'baking',      label: 'Baking' },
  { id: 'soft-drinks', label: 'Soft Drinks' },
];
function sectionLabel(s) { const sec = SECTIONS_ORDER.find(x => x.id === s); return sec ? sec.label : (s ? s.charAt(0).toUpperCase() + s.slice(1) : 'Other'); }
function tagClass(s) { const map = { starters:'tag-starters', fish:'tag-fish', beef:'tag-beef', pork:'tag-pork', meat:'tag-beef', chicken:'tag-chicken', veg:'tag-veg', sides:'tag-sides', baking:'tag-baking', 'soft-drinks':'tag-soft-drinks' }; return map[s] || 'tag-sides'; }
function tagLabel(s) { return sectionLabel(s); }

const expanded = new Set();
let activeSection = null;
let currentPage = 'recipes'; // 'recipes' | 'drinks' | 'seasonal' | 'foraging'
const PAGE_LABELS = { recipes: 'Recipes', drinks: 'Drinks', seasonal: 'Seasonal Produce', foraging: 'Foraging' };

function toggleMainMenu(e) {
  e.stopPropagation();
  document.getElementById('mainMenuDropdown').classList.toggle('open');
}
function closeMainMenu() {
  document.getElementById('mainMenuDropdown').classList.remove('open');
}
document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.menu-wrap');
  if (wrap && !wrap.contains(e.target)) closeMainMenu();
});
function switchToPage(page) {
  closeMainMenu();
  if (currentPage === page) { window.scrollTo(0, 0); return; }
  currentPage = page;
  window.scrollTo(0, 0);
  render();
}
function updateChromeForPage() {
  document.getElementById('menuCurrentLabel').textContent = PAGE_LABELS[currentPage];
  document.querySelectorAll('.menu-item').forEach(b => b.classList.toggle('active', b.dataset.page === currentPage));
  const onRecipes = currentPage === 'recipes';
  document.getElementById('sectionNavWrap').style.display = onRecipes ? '' : 'none';
  document.getElementById('calFilterWrap').style.display = onRecipes ? '' : 'none';
  document.getElementById('addBtn').style.display = onRecipes ? '' : 'none';
  document.getElementById('search').placeholder = currentPage === 'drinks' ? 'Search cocktails…' : currentPage === 'seasonal' ? 'Search produce…' : currentPage === 'foraging' ? 'Search foraging…' : 'Search recipes…';
}

function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function buildMeta(r) { return [r.serves && r.serves !== '—' ? 'Serves ' + r.serves : '', r.time && r.time !== '—' ? r.time : ''].filter(Boolean).join(' · '); }
function buildDetailMeta(r) { return [r.serves && r.serves !== '—' ? 'Serves ' + r.serves : '', r.time && r.time !== '—' ? r.time : '', r.calories ? r.calories + ' cal per serving' : ''].filter(Boolean).join(' · '); }

function renderNav(visibleSectionIds) {
  const nav = document.getElementById('sectionNav');
  const foodItems = SECTIONS_ORDER.filter(s => visibleSectionIds.has(s.id));
  nav.innerHTML = foodItems.map(s => {
    const count = recipes.filter(r => r.section === s.id).length;
    const isActive = activeSection === s.id;
    return '<a href="#sec-' + s.id + '" class="pill' + (isActive ? ' active' : '') + '" data-section="' + s.id + '" onclick="onPillClick(event, \'' + s.id + '\')">' + s.label + '<span class="pill-count">' + count + '</span></a>';
  }).join('');
}
function onPillClick(e, id) {
  activeSection = id;
  document.querySelectorAll('.pill').forEach(p => { p.classList.toggle('active', p.dataset.section === id); });
}

function render() {
  updateChromeForPage();
  const q = document.getElementById('search').value.toLowerCase().trim();
  const maxCalRaw = document.getElementById('calFilter').value;
  const maxCal = maxCalRaw !== '' ? parseInt(maxCalRaw, 10) : NaN;
  const hasCalFilter = Number.isFinite(maxCal) && maxCal > 0;
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  if (currentPage === 'seasonal') {
    grid.innerHTML = renderSeasonalSection(q);
    empty.style.display = 'none';
    document.getElementById('countBar').textContent = seasonalCountBarText(q);
    return;
  }
  if (currentPage === 'foraging') {
    grid.innerHTML = renderForagingSection(q);
    empty.style.display = 'none';
    document.getElementById('countBar').textContent = foragingCountBarText(q);
    return;
  }
  if (currentPage === 'drinks') {
    grid.innerHTML = renderCocktailSection(q);
    empty.style.display = 'none';
    const shown = drinks.filter(d => spiritMatches(d) && drinkQueryMatches(d, q)).length;
    document.getElementById('countBar').textContent = shown + ' cocktail' + (shown !== 1 ? 's' : '') + ' · ' + drinks.length + ' total';
    return;
  }
  let totalShown = 0;
  let html = '';
  const visibleSectionIds = new Set();
  for (const sec of SECTIONS_ORDER) {
    const secRecipes = recipes.filter(r => {
      const ms = r.section === sec.id;
      const mq = !q || r.title.toLowerCase().includes(q) || (r.description||'').toLowerCase().includes(q);
      const mc = !hasCalFilter || (r.calories && parseInt(r.calories, 10) < maxCal);
      return ms && mq && mc;
    });
    if (!secRecipes.length) continue;
    visibleSectionIds.add(sec.id);
    totalShown += secRecipes.length;
    const withRecipe = secRecipes.filter(r => !r.noRecipe).length;
    const countText = withRecipe + ' recipe' + (withRecipe !== 1 ? 's' : '') + (withRecipe !== secRecipes.length ? ' · ' + (secRecipes.length - withRecipe) + ' to add' : '');
    html += '<div class="section-block" id="sec-' + sec.id + '">'
      + '<div class="section-header"><h2>' + sec.label + '</h2><span class="section-count">' + countText + '</span></div>'
      + '<div class="recipe-list">' + secRecipes.map(r => renderRow(r)).join('') + '</div>'
      + '</div>';
  }
  if (!totalShown) { grid.innerHTML = ''; empty.style.display = 'block'; }
  else { empty.style.display = 'none'; grid.innerHTML = html; }
  document.getElementById('countBar').textContent = recipes.length + ' recipes · ' + totalShown + ' shown';
  if (!activeSection || !visibleSectionIds.has(activeSection)) { activeSection = visibleSectionIds.values().next().value || null; }
  renderNav(visibleSectionIds);
}

function renderRow(r) {
  const meta = buildMeta(r);
  const isExpanded = expanded.has(r.id);
  const noRecipe = !!r.noRecipe;
  const chevronSvg = '<svg class="chevron" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg>';
  const openSvg = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 2h5v5"/><path d="M14 2L7.5 8.5"/><path d="M13 9.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h3.5"/></svg>';
  const desc = r.description ? escapeHtml(r.description) : '';
  const title = escapeHtml(r.title);
  let expandInner;
  if (noRecipe) {
    expandInner = '<div class="expand-grid"><div class="expand-empty">No recipe saved yet. Cook this dish and add the recipe with + Add.</div></div>';
  } else if (!r.ingredients || !r.ingredients.length) {
    expandInner = '<div class="expand-grid"><div class="expand-empty">No ingredients listed.</div><div class="expand-actions"><button class="text-btn" onclick="event.stopPropagation();openDetail(\'' + r.id + '\')">View full recipe</button></div></div>';
  } else {
    const ingHtml = r.ingredients.map(i => '<li><span class="amt">' + escapeHtml(i.amount) + '</span>' + escapeHtml(i.item) + '</li>').join('');
    const metaText = meta ? '<span style="font-size:12px;color:var(--text-faint);">' + meta + '</span>' : '';
    expandInner = '<div class="expand-grid"><div class="expand-label">Ingredients</div>'
      + '<ul class="expand-ingredients">' + ingHtml + '</ul>'
      + '<div class="expand-actions"><button class="text-btn" onclick="event.stopPropagation();openDetail(\'' + r.id + '\')">View full recipe →</button>' + metaText + '</div>'
      + '</div>';
  }
  const rowClasses = 'recipe-row' + (isExpanded ? ' expanded' : '') + (noRecipe ? ' no-recipe' : '');
  return '<div class="' + rowClasses + '" data-id="' + r.id + '">'
    + '<div class="recipe-head" onclick="toggleExpand(\'' + r.id + '\')">'
    + '<div class="tag-wrap"><span class="card-tag ' + tagClass(r.section) + '">' + tagLabel(r.section) + '</span></div>'
    + '<div class="recipe-title-wrap"><div class="recipe-title">' + title + '</div>'
    + (desc ? '<div class="recipe-desc">' + desc + '</div>' : '')
    + '</div>'
    + '<div class="recipe-meta">' + meta + '</div>'
    + '<div class="row-actions">'
    + '<button class="icon-btn" title="View full recipe" onclick="event.stopPropagation();openDetail(\'' + r.id + '\')" aria-label="View full recipe">' + openSvg + '</button>'
    + '<button class="icon-btn" title="Toggle ingredients" onclick="event.stopPropagation();toggleExpand(\'' + r.id + '\')" aria-label="Toggle ingredients">' + chevronSvg + '</button>'
    + '</div></div>'
    + '<div class="recipe-expand">' + expandInner + '</div>'
    + '</div>';
}

function toggleExpand(id) {
  if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
  const row = document.querySelector('.recipe-row[data-id="' + id + '"]');
  if (row) row.classList.toggle('expanded'); else render();
}

  }
  document.getElementById('detailOverlay').classList.add('open');
}

function closeDetail(e) {
  if (!e || e.target === document.getElementById('detailOverlay')) {
    document.getElementById('detailOverlay').classList.remove('open');
  }
}

function setupScrollspy() {
  const update = () => {
    const headerH = (document.querySelector('.site-header') ? document.querySelector('.site-header').offsetHeight : 64);
    const navH = (document.querySelector('.section-nav') ? document.querySelector('.section-nav').offsetHeight : 48);
    const threshold = headerH + navH + 24;
    const sections = SECTIONS_ORDER.map(s => ({ id: s.id, el: document.getElementById('sec-' + s.id) })).filter(x => x.el);
    if (!sections.length) return;
    let current = sections[0].id;
    for (const item of sections) {
      if (item.el.getBoundingClientRect().top - threshold <= 0) current = item.id;
      else break;
    }
    if (current !== activeSection) {
      activeSection = current;
      document.querySelectorAll('.pill').forEach(p => { p.classList.toggle('active', p.dataset.section === current); });
    }
  };
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (!ticking) { window.requestAnimationFrame(() => { update(); ticking = false; }); ticking = true; }
  }, { passive: true });
  update();
}

function openAddModal() { document.getElementById('addOverlay').classList.add('open'); }
function closeAdd(e) {
  if (!e || e.target === document.getElementById('addOverlay')) {
    document.getElementById('addOverlay').classList.remove('open');
  }
}
function saveRecipe() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { alert('Please enter a title.'); return; }
  const rawIngredients = document.getElementById('f-ingredients').value.trim();
  const rawSteps = document.getElementById('f-steps').value.trim();
  const ingredients = rawIngredients ? rawIngredients.split('\n').filter(Boolean).map(line => {
    const parts = line.trim().split(/\s+/);
    const amount = parts[0] || '';
    const item = parts.slice(1).join(' ') || line.trim();
    return { amount, item };
  }) : [];
  const steps = rawSteps ? rawSteps.split('\n').filter(Boolean) : [];
  const recipe = {
    id: title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + Date.now(),
    title,
    section: document.getElementById('f-cat').value,
    category: document.getElementById('f-cat').value,
    serves: document.getElementById('f-serves').value.trim() || '2–3',
    time: document.getElementById('f-time').value.trim() || '—',
    description: document.getElementById('f-desc').value.trim() || '',
    ingredients, steps,
    notes: document.getElementById('f-notes').value.trim()
  };
  recipes.unshift(recipe);
  saveRecipesToStorage(recipes);
  closeAdd();
  render();
  ['f-title','f-serves','f-time','f-desc','f-ingredients','f-steps','f-notes'].forEach(id => document.getElementById(id).value = '');
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  document.getElementById('detailOverlay').classList.remove('open');
  document.getElementById('addOverlay').classList.remove('open');
});

let currentSpirit = 'all';
const cocktailExpanded = new Set();

function spiritMatches(d) {
  return currentSpirit === 'all' || d.spirits.includes(currentSpirit);
}

function drinkQueryMatches(d, q) {
  if (!q) return true;
  return d.name.toLowerCase().includes(q) ||
    d.spirit.toLowerCase().includes(q) ||
    d.ingredients.some(i => i.toLowerCase().includes(q));
}

function setSpirit(spirit, btn) {
  currentSpirit = spirit;
  document.querySelectorAll('.spirit-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function getCocktailPreview(d) {
  return d.ingredients.slice(0, 3).map(i =>
    i.replace(/^\d+[\w.–\-\/]*\s*(ml|tsp|tbsp|parts?|oz|dash(?:es)?|g|cup|tins?|handful|pinch|squeeze)\s*/i, '')
     .replace(/^\d+\s*/, '').trim()
  ).join(', ');
}

function spiritTagClass(spirits) {
  const s = spirits && spirits[0];
  return { gin:'tag-gin', bourbon:'tag-bourbon', vodka:'tag-vodka', tequila:'tag-tequila', rum:'tag-rum', mezcal:'tag-mezcal' }[s] || 'tag-spirit-other';
}

function parseCocktailIngredient(i) {
  const m = i.match(/^(\d[\d\w.–\-\/]*(?:\s*(?:ml|tsp|tbsp|parts?|oz|dash(?:es)?|g|cup|tins?|handful|pinch|squeeze)))\s+(.+)$/i);
  if (m) return '<li><span class="amt">' + escapeHtml(m[1]) + '</span>' + escapeHtml(m[2]) + '</li>';
  return '<li><span class="amt"></span>' + escapeHtml(i) + '</li>';
}

function toggleCocktailExpand(idx) {
  if (cocktailExpanded.has(idx)) cocktailExpanded.delete(idx); else cocktailExpanded.add(idx);
  const row = document.querySelector('.recipe-row[data-cocktail-idx="' + idx + '"]');
  if (row) row.classList.toggle('expanded'); else render();
}

function renderCocktailRow(d, idx) {
  const isExpanded = cocktailExpanded.has(idx);
  const tagCls = spiritTagClass(d.spirits);
  const preview = getCocktailPreview(d);
  const chevronSvg = '<svg class="chevron" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg>';
  const openSvg = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 2h5v5"/><path d="M14 2L7.5 8.5"/><path d="M13 9.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h3.5"/></svg>';
  const ingExpandHtml = d.ingredients.map(parseCocktailIngredient).join('');
  const metaText = d.rating ? '★ ' + d.rating : '';
  const expandInner = '<div class="expand-grid">'
    + '<div class="expand-label">Ingredients</div>'
    + '<ul class="expand-ingredients">' + ingExpandHtml + '</ul>'
    + '<div class="expand-actions"><button class="text-btn" onclick="event.stopPropagation();openCocktailDetail(' + idx + ')">View full recipe →</button>'
    + (metaText ? '<span style="font-size:12px;color:var(--text-faint);">' + escapeHtml(metaText) + '</span>' : '')
    + '</div></div>';
  const rowClasses = 'recipe-row' + (isExpanded ? ' expanded' : '');
  return '<div class="' + rowClasses + '" data-cocktail-idx="' + idx + '">'
    + '<div class="recipe-head" onclick="toggleCocktailExpand(' + idx + ')">'
    + '<div class="tag-wrap"><span class="card-tag ' + tagCls + '">' + escapeHtml(d.spirit) + '</span></div>'
    + '<div class="recipe-title-wrap"><div class="recipe-title">' + escapeHtml(d.name) + '</div>'
    + (preview ? '<div class="recipe-desc">' + escapeHtml(preview) + '</div>' : '')
    + '</div>'
    + '<div class="recipe-meta">' + escapeHtml(metaText) + '</div>'
    + '<div class="row-actions">'
    + '<button class="icon-btn" title="View full recipe" onclick="event.stopPropagation();openCocktailDetail(' + idx + ')" aria-label="View full recipe">' + openSvg + '</button>'
    + '<button class="icon-btn" title="Toggle ingredients" onclick="event.stopPropagation();toggleCocktailExpand(' + idx + ')" aria-label="Toggle ingredients">' + chevronSvg + '</button>'
    + '</div></div>'
    + '<div class="recipe-expand">' + expandInner + '</div>'
    + '</div>';
}

function renderCocktailSection(q) {
  const SPIRITS = [
    { id:'all', label:'All' }, { id:'gin', label:'Gin' }, { id:'bourbon', label:'Bourbon' },
    { id:'vodka', label:'Vodka' }, { id:'tequila', label:'Tequila' }, { id:'rum', label:'Rum' },
    { id:'mezcal', label:'Mezcal' }, { id:'other', label:'Other' }
  ];
  const filtered = drinks.filter(d => spiritMatches(d) && drinkQueryMatches(d, q));
  filtered.sort((a, b) => a.name.localeCompare(b.name));
  const spiritButtons = SPIRITS.map(s =>
    '<button class="spirit-btn' + (currentSpirit === s.id ? ' active' : '') + '" onclick="setSpirit(\'' + s.id + '\', this)">' + s.label + '</button>'
  ).join('');
  const rows = filtered.map(d => renderCocktailRow(d, drinks.indexOf(d))).join('');
  const emptyMsg = filtered.length === 0 ? '<div style="text-align:center;padding:3rem 1rem;color:var(--text-muted);font-style:italic;">No cocktails found.</div>' : '';
  return '<div class="section-block">'
    + '<div class="section-header"><h2>Cocktails</h2><span class="section-count">' + filtered.length + ' of ' + drinks.length + '</span></div>'
    + '<div class="spirit-filter">' + spiritButtons + '</div>'
    + '<div class="recipe-list">' + rows + '</div>'
    + emptyMsg + '</div>';
}

function openCocktailDetail(idx) {
  const d = drinks[idx];
  if (!d) return;
  const m = document.getElementById('detailModal');
  const tagCls = spiritTagClass(d.spirits);
  const ingHtml = d.ingredients.map(parseCocktailIngredient).join('');
  const garnishHtml = d.garnish ? '<p class="section-label" style="margin-top:1.25rem;">Garnish</p><div class="notes-box">' + escapeHtml(d.garnish) + '</div>' : '';
  const notesHtml = d.notes ? '<p class="section-label">Notes</p><div class="notes-box">' + escapeHtml(d.notes) + '</div>' : '';
  const ratingHtml = d.rating ? '<div style="margin-top:0.75rem;font-size:13px;color:var(--amber);">★ ' + escapeHtml(d.rating) + '</div>' : '';
  const printSvg = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>';
  m.innerHTML = '<button class="modal-close" onclick="closeDetail()">&#x2715;</button>'
    + '<span class="card-tag ' + tagCls + '">' + escapeHtml(d.spirit) + '</span>'
    + '<h2>' + escapeHtml(d.name) + '</h2>'
    + (d.rating ? '<div class="modal-meta">★ ' + escapeHtml(d.rating) + '</div>' : '')
    + '<div class="print-recipe-body">'
    + '<div><p class="section-label">Ingredients</p><ul class="ingredient-list">' + ingHtml + '</ul></div>'
    + '<div><p class="section-label">Method</p><ol class="steps"><li>' + escapeHtml(d.method) + '</li></ol>'
    + garnishHtml + '</div>'
    + '</div>'
    + notesHtml + ratingHtml
    + '<div class="modal-print-actions"><button class="print-btn" onclick="(function(t){var p=document.title;document.title=t;window.print();setTimeout(function(){document.title=p;},500);})(this.dataset.title)" data-title="' + escapeHtml(d.name) + '">' + printSvg + ' Print recipe</button></div>';
  document.getElementById('detailOverlay').classList.add('open');
}

function isInSeasonForMonth(p, month) {
  if (p.startMonth <= p.endMonth) return month >= p.startMonth && month <= p.endMonth;
  return month >= p.startMonth || month <= p.endMonth;
}
function seasonRangeLabel(p) {
  const short = MONTH_NAMES.map(m => m.slice(0, 3));
  return short[p.startMonth - 1] + '–' + short[p.endMonth - 1];
}
function seasonEndDateForToday(p, today) {
  const y = today.getFullYear();
  const m = today.getMonth() + 1;
  let endYear = y;
  if (p.startMonth > p.endMonth) {
    endYear = (m >= p.startMonth) ? y + 1 : y;
  }
  return new Date(endYear, p.endMonth, 0); // last day of endMonth
}
function daysLeftInSeason(p, today) {
  const end = seasonEndDateForToday(p, today);
  const startOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  return Math.round((end - startOfToday) / 86400000);
}
function matchesKeywords(text, matchArr) {
  return matchArr.some(kw => {
    const esc = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(^|[^a-z])' + esc + '([^a-z]|$)', 'i');
    return re.test(text);
  });
}
function normalizeMatchText(r) {
  const ingredientText = (r.ingredients || []).map(i => i.item).join(' | ');
  return (ingredientText + ' ' + (r.title || '') + ' ' + (r.description || '')).toLowerCase();
}
function normalizeDrinkText(d) {
  const ingredientText = (d.ingredients || []).join(' | ');
  return (ingredientText + ' ' + (d.name || '') + ' ' + (d.notes || '')).toLowerCase();
}
function produceMatchesRecipe(p, r) { return matchesKeywords(normalizeMatchText(r), p.match); }
function produceMatchesDrink(p, d) { return matchesKeywords(normalizeDrinkText(d), p.match); }
function matchRecipesForProduce(p) {
  return recipes.filter(r => !r.noRecipe && produceMatchesRecipe(p, r));
}
function matchDrinksForProduce(p) {
  return drinks.map((d, idx) => ({ d, idx })).filter(x => produceMatchesDrink(p, x.d));
}
function buildMatchChipsHtml(p) {
  const recipeMatches = matchRecipesForProduce(p);
  const drinkMatches = matchDrinksForProduce(p);
  const count = recipeMatches.length + drinkMatches.length;
  if (!count) {
    return { count: 0, html: '<div class="expand-grid"><div class="expand-empty">Nothing in your recipe book uses ' + escapeHtml(p.name.toLowerCase()) + ' yet.</div></div>' };
  }
  const recipeChips = recipeMatches.map(r => '<button class="text-btn" style="margin:2px 6px 6px 0;" onclick="event.stopPropagation();openDetail(\'' + r.id + '\')">' + escapeHtml(r.title) + '</button>').join('');
  const drinkChips = drinkMatches.map(x => '<button class="text-btn" style="margin:2px 6px 6px 0;" onclick="event.stopPropagation();openCocktailDetail(' + x.idx + ')">' + escapeHtml(x.d.name) + ' (drink)</button>').join('');
  return { count, html: '<div class="expand-grid"><div class="expand-label">Recipes &amp; drinks using ' + escapeHtml(p.name.toLowerCase()) + '</div><div>' + recipeChips + drinkChips + '</div></div>' };
}
function toggleSeasonalExpand(id) {

}

function todayFractionOfYear(today) {
  const y = today.getFullYear();
  const m = today.getMonth();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  return (m + (today.getDate() - 1) / daysInMonth) / 12;
}
function seasonBarSegments(p) {
  if (p.startMonth <= p.endMonth) {
    return [{ left: (p.startMonth - 1) / 12 * 100, width: (p.endMonth - p.startMonth + 1) / 12 * 100, roundLeft: true, roundRight: true }];
  }
  return [
    { left: (p.startMonth - 1) / 12 * 100, width: (12 - p.startMonth + 1) / 12 * 100, roundLeft: true, roundRight: false },
    { left: 0, width: p.endMonth / 12 * 100, roundLeft: false, roundRight: true },

}
function typeBarClass(type) {
  if (type === 'fruit' || type === 'berry') return 'is-fruit';

}
function seasonBarsHtml(p, active) {
  const cls = 'season-bar ' + typeBarClass(p.type) + ' ' + (active ? 'is-active' : 'is-inactive');

    const radius = (s.roundLeft && s.roundRight) ? '5px' : s.roundLeft ? '5px 0 0 5px' : s.roundRight ? '0 5px 5px 0' : '0';
    return '<div class="' + cls + '" style="left:' + s.left.toFixed(2) + '%;width:' + Math.max(s.width, 1.2).toFixed(2) + '%;border-radius:' + radius + ';"></div>';
  }).join('');
}
function monthsForwardFrom(startMonth, currentMonth) {
  return (startMonth - currentMonth + 12) % 12;
}
function sortByActiveThenSoon(items, currentMonth) {
  return items.slice().sort((a, b) => {
    const aActive = isInSeasonForMonth(a, currentMonth);
    const bActive = isInSeasonForMonth(b, currentMonth);
    if (aActive !== bActive) return aActive ? -1 : 1;
    const aKey = monthsForwardFrom(a.startMonth, currentMonth);
    const bKey = monthsForwardFrom(b.startMonth, currentMonth);
    if (aKey !== bKey) return aKey - bKey;
    return a.name.localeCompare(b.name);
  });
}

function nextMonthNumber(currentMonth) { return (currentMonth % 12) + 1; }

function seasonalFilteredSortedItems(q) {
  const today = new Date();
  const currentMonth = today.getMonth() + 1;
  const nextMonth = nextMonthNumber(currentMonth);
  const q2 = (q || '').toLowerCase();
  let items = SEASONAL_PRODUCE.filter(p => !q2 || p.name.toLowerCase().includes(q2));

  else if (seasonalTab === 'fruit') items = items.filter(p => p.type === 'fruit');
  else if (seasonalTab === 'nextmonth') items = items.filter(p => p.startMonth === nextMonth);

function renderSeasonalSection(q) {

  const introHtml = '<p class="season-intro">' + introText + '</p>';
  const tabBarHtml = renderSeasonalTabBar(nextMonthName);

  const fruitItems = items.filter(p => p.type === 'fruit');
  const emptyText = seasonalTab === 'nextmonth'

  const emptyMsg = !items.length ? '<div style="text-align:center;padding:3rem 1rem;color:var(--text-muted);font-style:italic;">' + emptyText + '</div>' : '';

  if (seasonalTab === 'nextmonth') {
    const nextMonthName = MONTH_NAMES[nextMonthNumber(currentMonth) - 1];
    return items.length + ' coming into season in ' + nextMonthName;
  }
  const activeCount = items.filter(p => isInSeasonForMonth(p, currentMonth)).length;
  return activeCount + ' in season now · ' + items.length + ' shown';
}

// ── Foraging page ──
function foragingFilteredSortedItems(q) {
  const today = new Date();
  const currentMonth = today.getMonth() + 1;
  const q2 = (q || '').toLowerCase();
  const items = FORAGING_ITEMS.filter(p => !q2 || p.name.toLowerCase().includes(q2));
  return sortByActiveThenSoon(items, currentMonth);
}
function renderForagingSection(q) {
  const today = new Date();
  const currentMonth = today.getMonth() + 1;
  const introHtml = '<p class="season-intro">Wild food realistically found around Leeds and the wider Yorkshire countryside — woodland edges, hedgerows, riverbanks and Dales/Pennine moorland. Solid bars are in season now.</p>'
    + '<p class="season-intro" style="margin-top:-0.75rem;">Only pick what you can identify with complete confidence — several UK fungi have toxic look-alikes. Get permission before foraging on private land, avoid roadside verges and dog-walking routes, and take only what you need.</p>';
  const axisHtml = renderSeasonAxisHeader(today);
  const items = foragingFilteredSortedItems(q);
  const body = FORAGING_GROUPS.map(g => renderTimelineGroup(g.label, items.filter(p => p.type === g.id), today, currentMonth)).join('');
  const emptyMsg = !items.length ? '<div style="text-align:center;padding:3rem 1rem;color:var(--text-muted);font-style:italic;">Nothing matches your search.</div>' : '';
  return introHtml + axisHtml + body + emptyMsg;
}
function foragingCountBarText(q) {
  const today = new Date();
  const currentMonth = today.getMonth() + 1;
  const items = foragingFilteredSortedItems(q);
  const activeCount = items.filter(p => isInSeasonForMonth(p, currentMonth)).length;
  return activeCount + ' foraging now · ' + items.length + ' shown';
}

render();
setupScrollspy();
</script>
</body></html>
