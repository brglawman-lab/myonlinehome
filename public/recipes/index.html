<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chef Claude — Recipe Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F7F4EF; --surface: #FFFFFF; --surface2: #F0EDE7;
    --border: #E2DDD5; --border-strong: #C8C2B8;
    --text: #1A1714; --text-muted: #7A7470; --text-faint: #B0AAA4;
    --accent: #2C5F2E; --accent-light: #EAF0EA; --accent-text: #1A3D1B;
    --red: #8B2E2E; --red-light: #F5EAEA;
    --amber: #8B5E1A; --amber-light: #FBF2E3;
    --blue: #1A3D6B; --blue-light: #E8EEF5;
    --teal: #1A5050; --teal-light: #E5F0F0;
    --pink: #6B2A4A; --pink-light: #F5EAF0;
    --radius: 4px; --radius-lg: 8px;
    --header-h: 64px; --nav-h: 48px;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.6; }
  .site-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; position: sticky; top: 0; z-index: 50; }
  .header-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: var(--header-h); gap: 1.5rem; }
  .logo { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--text); white-space: nowrap; flex-shrink: 0; }
  .logo span { color: var(--accent); font-style: italic; }
  .header-controls { display: flex; gap: 10px; align-items: center; flex: 1; max-width: 560px; }
  .search-wrap { flex: 1; position: relative; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }
  input[type="text"] { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); outline: none; transition: border-color 0.15s; }
  input[type="text"]:focus { border-color: var(--border-strong); background: white; }
  .cal-filter-wrap { flex-shrink: 0; }
  .cal-input { width: 92px; padding: 9px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); outline: none; transition: border-color 0.15s; }
  .cal-input:focus { border-color: var(--border-strong); background: white; }
  .cal-input::-webkit-outer-spin-button, .cal-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .cal-input[type="number"] { -moz-appearance: textfield; }
  .add-btn { padding: 9px 16px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; }
  .add-btn:hover { opacity: 0.88; }
  .section-nav { background: var(--bg); border-bottom: 1px solid var(--border); position: sticky; top: var(--header-h); z-index: 40; padding: 0 2rem; }
  .section-nav-inner { max-width: 1100px; margin: 0 auto; height: var(--nav-h); display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .section-nav-inner::-webkit-scrollbar { display: none; }
  .pill { background: transparent; color: var(--text-muted); border: 1px solid transparent; border-radius: 999px; padding: 5px 12px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background 0.15s, color 0.15s, border-color 0.15s; }
  .pill:hover { background: var(--surface2); color: var(--text); }
  .pill.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .pill.active:hover { background: var(--text); color: var(--bg); }
  .pill .pill-count { font-size: 11px; opacity: 0.6; margin-left: 4px; }
  .main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 2rem 4rem; }
  .count-bar { font-size: 12px; color: var(--text-faint); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 1.5rem; }
  .section-block { margin-bottom: 2.5rem; scroll-margin-top: calc(var(--header-h) + var(--nav-h) + 8px); }
  .section-header { display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
  .section-header h2 { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 400; color: var(--text); }
  .section-count { font-size: 12px; color: var(--text-faint); letter-spacing: 0.04em; }
  .recipe-list { display: flex; flex-direction: column; }
  .recipe-row { border-bottom: 1px solid var(--border); transition: background 0.12s; }
  .recipe-row:hover { background: var(--surface); }
  .recipe-row.expanded { background: var(--surface); }
  .recipe-head { display: grid; grid-template-columns: 100px 1fr auto auto; align-items: center; gap: 14px; padding: 12px 8px; cursor: pointer; min-height: 56px; }
  .recipe-head .tag-wrap { display: flex; align-items: center; }
  .card-tag { display: inline-block; font-size: 10px; font-weight: 500; letter-spacing: 0.05em; padding: 3px 8px; border-radius: 2px; text-transform: uppercase; width: fit-content; }
  .recipe-title-wrap { min-width: 0; }
  .recipe-title { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 400; color: var(--text); line-height: 1.25; margin-bottom: 2px; }
  .recipe-desc { font-size: 13px; color: var(--text-muted); line-height: 1.4; }
  .recipe-meta { font-size: 12px; color: var(--text-faint); white-space: nowrap; text-align: right; }
  .row-actions { display: flex; align-items: center; gap: 2px; }
  .icon-btn { background: none; border: none; color: var(--text-faint); cursor: pointer; padding: 6px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s; }
  .icon-btn:hover { background: var(--surface2); color: var(--text); }
  .icon-btn svg { display: block; }
  .chevron { transition: transform 0.2s; }
  .recipe-row.expanded .chevron { transform: rotate(180deg); }
  .recipe-row.no-recipe .recipe-title { color: var(--text-muted); }
  .recipe-row.no-recipe .recipe-desc { color: var(--text-faint); font-style: italic; }
  .recipe-row.no-recipe .card-tag { opacity: 0.6; }
  .recipe-expand { display: none; padding: 4px 8px 18px 122px; animation: slideDown 0.15s ease-out; }
  .recipe-row.expanded .recipe-expand { display: block; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .expand-grid { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; }
  .expand-label { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 0.5rem; }
  .expand-ingredients { list-style: none; columns: 2; column-gap: 2rem; }
  .expand-ingredients li { display: flex; gap: 10px; padding: 3px 0; font-size: 13.5px; break-inside: avoid; line-height: 1.5; }
  .expand-ingredients li .amt { color: var(--text-muted); min-width: 70px; flex-shrink: 0; }
  .expand-actions { margin-top: 0.9rem; padding-top: 0.75rem; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
  .text-btn { background: none; border: 1px solid var(--border-strong); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 12.5px; padding: 6px 12px; border-radius: var(--radius); cursor: pointer; transition: background 0.15s; }
  .text-btn:hover { background: var(--surface2); }
  .expand-empty { font-size: 13px; color: var(--text-muted); font-style: italic; }
  .empty { text-align: center; padding: 4rem 1rem; color: var(--text-muted); }
  .empty p { font-size: 15px; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(20,16,12,0.5); z-index: 200; align-items: flex-start; justify-content: center; padding: 2rem 1rem; overflow-y: auto; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); width: 100%; max-width: 640px; padding: 2rem; position: relative; margin: auto; }
  .modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-faint); line-height: 1; padding: 4px; }
  .modal-close:hover { color: var(--text); }
  .modal h2 { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 400; margin: 8px 0 4px; line-height: 1.3; }
  .modal-meta { font-size: 13px; color: var(--text-muted); margin-bottom: 1.5rem; }
  .modal-image { width: 100%; max-height: 320px; object-fit: cover; border-radius: var(--radius); margin-bottom: 1.5rem; display: block; }
  .section-label { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); margin: 1.5rem 0 0.6rem; }
  .ingredient-list { list-style: none; }
  .ingredient-list li { display: flex; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .ingredient-list li:last-child { border-bottom: none; }
  .ingredient-list li .amt { color: var(--text-muted); min-width: 90px; flex-shrink: 0; }
  .steps { list-style: none; counter-reset: steps; }
  .steps li { counter-increment: steps; padding: 8px 0 8px 2.25rem; border-bottom: 1px solid var(--border); font-size: 14px; line-height: 1.65; position: relative; }
  .steps li:last-child { border-bottom: none; }
  .steps li::before { content: counter(steps); position: absolute; left: 0; top: 10px; font-size: 11px; font-weight: 500; color: var(--text-faint); width: 1.5rem; font-family: 'DM Sans', sans-serif; }
  .notes-box { background: var(--surface2); border-left: 3px solid var(--border-strong); padding: 0.75rem 1rem; font-size: 13px; color: var(--text-muted); line-height: 1.65; border-radius: 0 var(--radius) var(--radius) 0; }
  .no-recipe-box { text-align: center; padding: 2rem; background: var(--surface2); border-radius: var(--radius-lg); font-size: 14px; color: var(--text-muted); margin: 1.5rem 0; }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; letter-spacing: 0.04em; text-transform: uppercase; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); background: var(--bg); outline: none; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--border-strong); background: white; }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-hint { font-size: 12px; color: var(--text-faint); margin-top: 3px; }
  .save-btn { width: 100%; padding: 11px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 1rem; transition: opacity 0.15s; }
  .save-btn:hover { opacity: 0.88; }
  .tag-starters { background: var(--blue-light); color: var(--blue); }
  .tag-fish { background: var(--teal-light); color: var(--teal); }
  .tag-meat { background: var(--red-light); color: var(--red); }
  .tag-chicken { background: var(--amber-light); color: var(--amber); }
  .tag-veg { background: var(--accent-light); color: var(--accent-text); }
  .tag-sides { background: var(--surface2); color: var(--text-muted); }
  .tag-baking { background: var(--pink-light); color: var(--pink); }
  .tag-soft-drinks { background: #e5f4ee; color: #1a5c3a; }
  .tag-beef { background: var(--red-light); color: var(--red); }
  .tag-pork { background: #FAE8DF; color: #8B3A20; }
  /* ── Cocktail spirit tags ── */
  .tag-gin     { background: var(--teal-light); color: var(--teal); }
  .tag-bourbon { background: var(--amber-light); color: var(--amber); }
  .tag-vodka   { background: var(--blue-light); color: var(--blue); }
  .tag-tequila { background: var(--accent-light); color: var(--accent-text); }
  .tag-rum     { background: var(--red-light); color: var(--red); }
  .tag-mezcal  { background: var(--pink-light); color: var(--pink); }
  .tag-spirit-other { background: var(--surface2); color: var(--text-muted); }
  /* ── Spirit filter bar ── */
  .spirit-filter { display: flex; flex-wrap: wrap; gap: 6px; margin: 0.5rem 0 1.25rem; }
  .spirit-btn { background: transparent; color: var(--text-muted); border: 1px solid transparent; border-radius: 999px; padding: 5px 12px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background 0.15s, color 0.15s, border-color 0.15s; }
  .spirit-btn:hover { background: var(--surface2); color: var(--text); }
  .spirit-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  /* ── Main hamburger menu ── */
  .menu-wrap { position: relative; flex-shrink: 0; }
  .menu-btn { display: flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; font-family: 'DM Sans', sans-serif; font-size: 13.5px; font-weight: 500; color: var(--text); cursor: pointer; transition: background 0.15s; white-space: nowrap; }
  .menu-btn:hover { background: var(--surface2); }
  .menu-dropdown { display: none; position: absolute; top: calc(100% + 6px); left: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 10px 28px rgba(20,16,12,0.14); min-width: 200px; z-index: 70; overflow: hidden; padding: 5px; }
  .menu-dropdown.open { display: block; }
  .menu-item { display: block; width: 100%; text-align: left; padding: 9px 12px; background: none; border: none; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); cursor: pointer; transition: background 0.15s; }
  .menu-item:hover { background: var(--surface2); }
  .menu-item.active { background: var(--accent-light); color: var(--accent-text); font-weight: 500; }
  /* ── Seasonal produce timeline ── */
  .season-intro { font-size: 13px; color: var(--text-muted); margin: 0 0 1.25rem; }
  .season-icon { width: 38px; height: 38px; border-radius: 999px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; line-height: 1; }
  .season-row.is-active-row .season-icon { background: var(--accent-light); }
  .season-head { display: grid; grid-template-columns: 38px 200px 1fr 60px 32px; align-items: center; gap: 14px; padding: 10px 8px; cursor: pointer; min-height: 56px; }
  .season-axis { display: grid; grid-template-columns: 38px 200px 1fr 60px 32px; gap: 14px; padding: 0 8px 8px; margin-top: 0.25rem; }
  .season-axis-track { grid-column: 3; position: relative; height: 30px; border-bottom: 1px solid var(--border); }
  .season-axis-label { position: absolute; bottom: 6px; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-faint); transform: translateX(2px); }
  .season-track { position: relative; height: 20px; }
  .season-bar { position: absolute; top: 4px; height: 12px; }
  .season-bar.is-veg.is-active { background: var(--accent); }
  .season-bar.is-veg.is-inactive { background: var(--accent-light); }
  .season-bar.is-fruit.is-active { background: var(--pink); }
  .season-bar.is-fruit.is-inactive { background: var(--pink-light); }
  .season-bar.is-fungi.is-active { background: var(--amber); }
  .season-bar.is-fungi.is-inactive { background: var(--amber-light); }
  .season-today-line { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--red); opacity: 0.6; }
  .season-today-line-axis { top: 0; bottom: -5px; opacity: 0.6; }
  .season-today-label { position: absolute; bottom: 100%; margin-bottom: 2px; font-size: 10px; font-weight: 500; color: var(--red); white-space: nowrap; transform: translateX(-50%); }
  .season-count-meta { font-size: 12px; color: var(--text-faint); text-align: right; }
  .season-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
  .season-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .season-card-icon { width: 42px; height: 42px; border-radius: 999px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .season-card-name { font-family: 'Playfair Display', serif; font-size: 14.5px; line-height: 1.25; color: var(--text); }
  .season-card-range { font-size: 11.5px; color: var(--text-faint); letter-spacing: 0.02em; }
  @media (max-width: 720px) {
    .site-header { padding: 0 1rem; }
    .section-nav { padding: 0 1rem; }
    .main { padding: 1.25rem 1rem 3rem; }
    .header-inner { flex-wrap: wrap; height: auto; padding: 0.75rem 0; gap: 8px; }
    .logo { flex: 1; }
    .header-controls { max-width: 100%; }
    .form-row { grid-template-columns: 1fr; }
    .recipe-head { grid-template-columns: 1fr auto; gap: 8px; padding: 12px 4px; }
    .recipe-head .tag-wrap { display: none; }
    .recipe-meta { display: none; }
    .recipe-desc { }
    .recipe-expand { padding: 4px 4px 16px; }
    .expand-ingredients { columns: 1; }
    .season-head { grid-template-columns: 34px 1fr; grid-template-areas: "icon title" "track track"; row-gap: 6px; padding: 10px 4px; }
    .season-head .season-icon { grid-area: icon; width: 34px; height: 34px; font-size: 16px; }
    .season-head .recipe-title-wrap { grid-area: title; }
    .season-head .season-track { grid-area: track; height: 16px; }
    .season-head .season-count-meta, .season-head .row-actions { display: none; }
    .season-axis { grid-template-columns: 34px 1fr; padding: 0 4px 8px; }
    .season-axis-track { grid-column: 2; }
    .season-card-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
    .season-card { padding: 12px 6px; }
  }
  /* ── Print button (screen) ── */
  .modal-print-actions { margin-top: 1.25rem; padding-top: 0.75rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }
  .print-btn { background: none; border: 1px solid var(--border-strong); color: var(--text-muted); font-family: 'DM Sans', sans-serif; font-size: 12.5px; padding: 6px 12px; border-radius: var(--radius); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background 0.15s, color 0.15s; }
  .print-btn:hover { background: var(--surface2); color: var(--text); }
  /* ── Print / recipe card view ── */
  @media print {
    .site-header, .section-nav, .main, #addOverlay, .modal-close, .modal-print-actions { display: none !important; }
    body { background: white; }
    #detailOverlay { display: block !important; position: static !important; background: none !important; padding: 0 !important; overflow: visible !important; }
    #detailModal { max-width: 100% !important; border: none !important; box-shadow: none !important; padding: 0 !important; margin: 0 !important; border-radius: 0 !important; }
    #detailModal .card-tag { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    #detailModal h2 { font-size: 22pt; margin: 6pt 0 2pt; }
    #detailModal .modal-meta { font-size: 10pt; margin-bottom: 14pt; }
    .print-recipe-body { display: grid; grid-template-columns: 1fr 1.6fr; gap: 28pt; margin-top: 4pt; }
    #detailModal .section-label { font-size: 7.5pt; margin: 0 0 5pt; }
    #detailModal .ingredient-list li { font-size: 10pt; padding: 4pt 0; }
    #detailModal .ingredient-list li .amt { min-width: 72pt; }
    #detailModal .steps li { font-size: 10pt; padding: 5pt 0 5pt 18pt; line-height: 1.55; }
    #detailModal .notes-box { font-size: 9.5pt; margin-top: 14pt; }
    #detailModal .section-label + .notes-box { margin-top: 0; }
    @page { margin: 2cm; }
  }
</style>
</head>

<header class="site-header">
  <div class="header-inner">
    <div class="menu-wrap">
      <button class="menu-btn" onclick="toggleMainMenu(event)" aria-haspopup="true" aria-label="Menu">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 4h12"/><path d="M2 8h12"/><path d="M2 12h12"/></svg>
        <span id="menuCurrentLabel">Recipes</span>
        <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg>
