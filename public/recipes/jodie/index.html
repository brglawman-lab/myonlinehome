<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F7F4EF; --surface: #FFFFFF; --surface2: #F0EDE7;
    --border: #E2DDD5; --border-strong: #C8C2B8;
    --text: #1A1714; --text-muted: #7A7470; --text-faint: #B0AAA4;
    --accent: #2C5F2E; --accent-light: #EAF0EA; --accent-text: #1A3D1B;
    --radius: 4px; --radius-lg: 10px;
    --header-h: 64px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.6; }

  /* ---- header, matched to the recipe book ---- */
  .site-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; position: sticky; top: 0; z-index: 50; }
  .header-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: var(--header-h); gap: 1.5rem; }
  .logo { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--text); white-space: nowrap; flex-shrink: 0; }
  .logo span { color: var(--accent); font-style: italic; }
  .menu-wrap { position: relative; flex-shrink: 0; }
  .menu-btn { display: flex; align-items: center; gap: 7px; padding: 8px 12px; background: none; border: 1px solid var(--border); border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); cursor: pointer; }
  .menu-btn:hover { background: var(--surface2); }
  .menu-dropdown { display: none; position: absolute; top: calc(100% + 6px); left: 0; min-width: 220px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 6px 20px rgba(0,0,0,0.09); padding: 5px; z-index: 60; }
  .menu-dropdown.open { display: block; }
  .menu-item { display: block; width: 100%; text-align: left; padding: 9px 12px; background: none; border: none; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); cursor: pointer; text-decoration: none; transition: background 0.15s; }
  .menu-item:hover { background: var(--surface2); }
  .menu-item.active { background: var(--accent-light); color: var(--accent-text); font-weight: 500; }
  .header-right { flex-shrink: 0; }
  .ghost-link { font-size: 14px; color: var(--text-muted); text-decoration: none; padding: 8px 12px; border-radius: var(--radius); }
  .ghost-link:hover { background: var(--surface2); color: var(--text); }

  .main { max-width: 900px; margin: 0 auto; padding: 2rem 2rem 7rem; }
  h1 { font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 400; line-height: 1.2; margin-bottom: 1.25rem; }
  h1 em { color: var(--accent); }

  /* ---- mood board ---- */
  .board { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 104px; grid-auto-flow: dense; gap: 10px; }
  .tile { position: relative; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; padding: 12px 14px; border: 2px solid transparent; border-radius: var(--radius-lg); background: var(--tint); color: var(--text); font-family: 'DM Sans', sans-serif; text-align: left; cursor: pointer; transition: transform 0.15s, border-color 0.15s, opacity 0.15s, box-shadow 0.15s; }
  .tile:hover { transform: translateY(-2px); }
  .tile:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .tile.wide { grid-column: span 2; }
  .tile.tall { grid-row: span 2; }
  .tile .emoji { font-size: 30px; line-height: 1; }
  .tile.tall .emoji, .tile.wide .emoji { font-size: 40px; }
  .tile .label { font-size: 15px; font-weight: 500; line-height: 1.25; }
  .tile.tall .label { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 400; }
  .tile.on { border-color: var(--text); box-shadow: 0 6px 16px rgba(20,16,12,0.12); }
  .tile.on::after { content: '✓'; position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 50%; background: var(--text); color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .board.full .tile:not(.on) { opacity: 0.45; }
  .tile.nope { animation: nope 0.35s; }
  @keyframes nope { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

  .order-in { margin-top: 1.25rem; font-size: 14px; color: var(--text-muted); }
  .order-in a { color: var(--text-muted); }

  /* ---- confirm bar ---- */
  .confirm-bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 2rem; z-index: 40; }
  .confirm-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .count { font-size: 14px; color: var(--text-muted); }
  .count strong { color: var(--text); }
  .btn { padding: 11px 22px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .btn:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .text-btn { background: none; border: none; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--accent); cursor: pointer; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }

  /* ---- results ---- */
  .chosen { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1rem; }
  .chip { font-size: 13px; padding: 3px 11px; border-radius: 999px; background: var(--tint, var(--surface2)); }
  .results-head { margin-bottom: 1rem; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .dish { display: flex; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px; text-decoration: none; color: var(--text); transition: border-color 0.14s, box-shadow 0.25s; }
  .dish:hover { border-color: var(--border-strong); }
  .thumb { flex: 0 0 84px; height: 84px; border-radius: var(--radius); background: var(--surface2) center/cover no-repeat; display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .dish-body { flex: 1; min-width: 0; }
  .dish-top { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
  .dish-title { font-family: 'Playfair Display', serif; font-size: 19px; line-height: 1.25; margin-bottom: 3px; }
  .score { flex-shrink: 0; font-size: 12px; font-weight: 500; color: var(--accent-text); background: var(--accent-light); padding: 2px 8px; border-radius: 999px; }
  .dish-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; font-size: 12px; color: var(--text-faint); align-items: center; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--tint); color: var(--text); }
  .course { text-transform: uppercase; letter-spacing: 0.06em; font-size: 10px; }
  .empty-note, .loading { text-align: center; padding: 3rem 1.5rem; color: var(--text-muted); font-style: italic; background: var(--surface); border: 1px dashed var(--border-strong); border-radius: var(--radius-lg); }
  .footer-actions { margin-top: 1.5rem; display: flex; gap: 1.25rem; flex-wrap: wrap; }

  /* ---- takeaway celebration ---- */
  .party { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; overflow: hidden; text-align: center; color: #fff;
    background: #00CCBC; animation: disco 0.6s steps(1) infinite; }
  .party.on { display: flex; }
  @keyframes disco { 0% { background: #00CCBC; } 25% { background: #FF3D7F; } 50% { background: #7B2FF7; } 75% { background: #FF9F1C; } }
  .rays { position: absolute; width: 260vmax; height: 260vmax; left: 50%; top: 50%; margin: -130vmax 0 0 -130vmax;
    background: repeating-conic-gradient(rgba(255,255,255,0.22) 0 10deg, transparent 10deg 20deg); animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .party-card { position: relative; padding: 1rem; }
  .trophy { font-size: 120px; line-height: 1; display: inline-block; animation: trophy 0.9s ease-in-out infinite; filter: drop-shadow(0 8px 20px rgba(0,0,0,0.3)); }
  @keyframes trophy { 0%, 100% { transform: rotate(-12deg) scale(1); } 50% { transform: rotate(12deg) scale(1.18); } }
  .winner { font-family: 'Playfair Display', serif; font-weight: 700; font-size: clamp(48px, 13vw, 110px); line-height: 1; letter-spacing: 0.02em; text-shadow: 4px 4px 0 #1A1714; animation: pulse 0.45s ease-in-out infinite alternate; margin: 0.5rem 0; }
  @keyframes pulse { from { transform: scale(0.94) rotate(-2deg); } to { transform: scale(1.06) rotate(2deg); } }
  .prize { display: inline-block; background: #FFD23F; color: #1A1714; font-weight: 700; font-size: clamp(16px, 4.5vw, 24px); padding: 10px 22px; border-radius: 999px; border: 3px solid #1A1714; transform: rotate(-3deg); box-shadow: 4px 4px 0 #1A1714; }
  .party-sub { margin-top: 1.25rem; font-size: 16px; font-weight: 500; text-shadow: 1px 1px 0 rgba(0,0,0,0.35); }
  .party-actions { margin-top: 1rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; align-items: center; }
  .party-actions a { background: #fff; color: #1A1714; text-decoration: none; font-weight: 700; padding: 10px 20px; border-radius: 999px; }
  .party-actions button { background: none; border: none; color: #fff; text-decoration: underline; font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) {
    .party, .rays, .trophy, .winner { animation: none; }
  }

  @media (max-width: 640px) {
    .site-header, .main { padding-left: 1rem; padding-right: 1rem; }
    .confirm-bar { padding-left: 1rem; padding-right: 1rem; }
    .header-inner { gap: 0.75rem; }
    .header-right { display: none; }
    h1 { font-size: 27px; }
    .board { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 92px; gap: 8px; }
    .tile.tall .label { font-size: 19px; }
    .thumb { flex-basis: 64px; height: 64px; }
    .dish-title { font-size: 17px; }
  }
</style>
</head>

<header class="site-header">

<script>
/* ===========================================================================
 * What does Jodie want to eat?
 *
 * One mood board: tap up to five things (chicken, spicy, really hungry, …)
 * and get every recipe that matches at least one, most matches first.
 * Mains, starters and sides are all in play. Really hungry + not that
 * healthy skips the recipes altogether and throws a party on the way to
 * Deliveroo.
 *
 * Like the Meal Builder this fetches /recipes/ and lifts DEFAULT_RECIPES out
 * of it, then applies the database overlay, so new recipes appear here too.
 * TAGS is hand-written for the recipes that existed when this page was made;
 * anything else is tagged from its section, calories and keywords.
 * ======================================================================== */

/* Deliveroo's own link: on a phone with the app installed it opens the app. */
const DELIVEROO_URL = 'https://deliveroo.co.uk/';
const MAX_PICKS = 5;

/* Board order is the mood-board layout. `size` is wide or tall for the
 * bigger tiles; `not` is the option it can't be picked alongside. */
const OPTIONS = [
  { id: 'chicken',  label: 'Chicken',          emoji: '🍗', tint: '#F6E3C6', size: 'tall' },
  { id: 'spicy',    label: 'Spicy',            emoji: '🌶️', tint: '#F7D4CC' },
  { id: 'hearty',   label: 'Really hungry',    emoji: '🤤', tint: '#F3D9E4', not: 'light' },
  { id: 'fish',     label: 'Fish',             emoji: '🐟', tint: '#D3E6EE', size: 'wide' },
  { id: 'comfort',  label: 'Comfort food',     emoji: '🛋️', tint: '#EADFD3' },
  { id: 'healthy',  label: 'Healthy',          emoji: '🥗', tint: '#D9EBD3', not: 'treat' },
  { id: 'veg',      label: 'Veg',              emoji: '🥦', tint: '#DCEBCF', size: 'tall' },
  { id: 'creamy',   label: 'Creamy & cheesy',  emoji: '🧀', tint: '#F8EBC4' },
  { id: 'light',    label: 'Not that hungry',  emoji: '🤏', tint: '#E4E1F1', not: 'hearty' },
  { id: 'asian',    label: 'Asian',            emoji: '🥢', tint: '#F4DAD2' },
  { id: 'treat',    label: 'Not that healthy', emoji: '🍟', tint: '#FBE2B8', size: 'wide', not: 'healthy' },
  { id: 'other',    label: 'Other meats',      emoji: '🥩', tint: '#EED3D0', size: 'tall' },
  { id: 'fresh',    label: 'Fresh & light',    emoji: '🍋', tint: '#F4F0C6' },
  { id: 'mexican',  label: 'Mexican',          emoji: '🌮', tint: '#F6DCC2' },
  { id: 'handheld', label: 'Sandwiches, wraps & tacos', emoji: '🥪', tint: '#E9E2D6', size: 'wide' },
  { id: 'bbq',      label: 'BBQ',              emoji: '🔥', tint: '#F5D6C6' },
  { id: 'quick',    label: 'Quick',            emoji: '⏱️', tint: '#D8E4EE', size: 'wide' },
];
const PROTEIN_IDS = ['chicken', 'fish', 'veg', 'other'];

/* Sections that never get suggested. Everything else is a main, starter or side. */
const SKIP_SECTIONS = new Set(['dips', 'baking', 'soft-drinks']);
const COURSE = { starters: 'Starter', sides: 'Side' };

/* Protein for recipes outside the chicken / fish / veg sections. */
const PROTEIN_OVERRIDE = {
  'gambas-al-ajillo': 'fish',
  'roast-tomato-whipped-feta-toast': 'other',
  'baked-camembert-chorizo-tomatoes': 'other',
};
const COURSE_OVERRIDE = { 'bbq-courgettes-asparagus': 'Side' };

/* light / hearty = not that hungry / really hungry; healthy / treat = healthy / not that healthy. */
const TAGS = {
  // chicken
  'cajun-chicken-nachos':          ['comfort', 'spicy', 'creamy', 'mexican', 'hearty', 'treat'],
  'cajun-chicken-wraps':           ['spicy', 'fresh', 'handheld', 'light', 'healthy'],
  'pad-thai':                      ['asian', 'comfort', 'hearty', 'treat'],
  'chicken-caesar':                ['creamy', 'fresh', 'hearty', 'treat'],
  'shawarma-roast-chicken':        ['comfort', 'fresh', 'hearty', 'healthy'],
  'grilled-herb-chicken-sandwich': ['handheld', 'fresh', 'bbq', 'light', 'healthy'],
  // fish
  'kewpie-prawn-baguette':         ['handheld', 'creamy', 'light', 'treat'],
  'salmon-rice-bowls':             ['fresh', 'asian', 'hearty', 'healthy'],
  'thomas-straker-salmon-slaw':    ['fresh', 'creamy', 'light', 'healthy'],
  'gambas-al-ajillo':              ['spicy', 'light', 'treat'],
  'wild-salmon-beetroot-labneh':   ['fresh', 'creamy', 'hearty', 'healthy'],
  'tuna-cannellini-bean-salad':    ['fresh', 'light', 'healthy'],
  'bbq-salmon-dill-creme-fraiche': ['bbq', 'fresh', 'creamy', 'light', 'healthy'],
  'gambas-pil-pil-bbq':            ['bbq', 'spicy', 'light', 'healthy'],
  'fish-cakes-greek-salad':        ['fresh', 'comfort', 'light', 'healthy'],
  'smoked-mackerel-sour-cream-baguette': ['handheld', 'creamy', 'light'],
  // veg
  'baked-mac-cheese':              ['comfort', 'creamy', 'hearty', 'treat'],
  'sundried-tomato-chickpea-stew': ['comfort', 'spicy', 'healthy'],
  'leek-potato-soup':              ['comfort', 'creamy', 'light', 'healthy'],
  'chipotle-black-bean-halloumi-tacos': ['mexican', 'spicy', 'handheld', 'hearty'],
  'creamy-harissa-butter-beans':   ['creamy', 'spicy', 'comfort', 'light', 'healthy'],
  'spicy-bean-enchiladas':         ['mexican', 'spicy', 'comfort', 'creamy', 'hearty', 'treat'],
  'cheesy-bean-burritos':          ['mexican', 'comfort', 'creamy', 'handheld', 'hearty', 'treat'],
  'black-bean-cheddar-quesadillas': ['mexican', 'creamy', 'handheld', 'treat'],
  'bbq-courgettes-asparagus':      ['bbq', 'fresh', 'light', 'healthy'],
  'crispy-tofu-khao-soi':          ['asian', 'spicy', 'creamy', 'comfort', 'hearty'],

  'pork-belly-banh-mi':            ['asian', 'handheld', 'fresh', 'spicy', 'hearty'],
  'pork-belly-ramen':              ['asian', 'comfort', 'spicy', 'hearty'],
  'roast-tomato-whipped-feta-toast': ['fresh', 'creamy', 'light'],
  'baked-camembert-chorizo-tomatoes': ['comfort', 'creamy', 'treat'],

/* Fallbacks for recipes with no TAGS entry. */
const KEYWORDS = {
  comfort:  /\b(stew|braise|braised|bake|baked|mash|pie|soup|roast|slow|hearty|comfort|pasta|mac)\b/i,
  spicy:    /(spic|chilli|chili|chipotle|harissa|cajun|sriracha|jalape|hot\b|curry)/i,
  creamy:   /(cream|cheese|cheesy|cheddar|mozzarella|parmesan|feta|halloumi|coconut|mayo|crème|creme)/i,
  fresh:    /\b(salad|slaw|fresh|light|pickled|herb|lemon|grilled)\b/i,
  asian:    /(soy|miso|thai|ramen|noodle|teriyaki|sesame|ginger|hoisin|asian|curry|kimchi|gochujang)/i,
  mexican:  /(taco|burrito|enchilada|quesadilla|nacho|chipotle|salsa|tortilla|mexican|carnitas)/i,
  handheld: /(sandwich|baguette|wrap|taco|burger|bagel|ciabatta|toast|burrito|bun|bánh|banh)/i,
  bbq:      /\b(bbq|barbecue|grill|grilled|charred)\b/i,
};
const INDULGENT = /(cheese|cheesy|cream|fried|butter|mayo|bacon|pancetta|chorizo|pastry|caramel)/i;
const PROTEIN_WORDS = {
  chicken: /chicken/i,
  fish: /(fish|salmon|tuna|cod|prawn|gambas|mackerel|haddock|crab|squid|anchov)/i,
  other: /(beef|steak|pork|chorizo|bacon|pancetta|lamb|sausage|ham\b|pepperoni|duck)/i,
};

/* ===========================================================================
 * Loading the library (same approach as the Meal Builder)
 * ======================================================================== */
let DISHES = [];
let loadError = null;

function extractArray(html, marker) {
  const at = html.indexOf(marker);
  if (at < 0) return null;
  const open = at + marker.length - 1;
  const close = html.indexOf('\n];', open);
  if (close < 0) return null;
  try { return (new Function('return ' + html.slice(open, close + 2) + ';'))(); }
  catch (e) { console.warn('Could not parse ' + marker, e); return null; }
}

function mergeById(base, overlay) {
  const map = new Map(base.map(r => [r.id, r]));
  for (const r of overlay) map.set(r.id, r);
  return [...map.values()];
}

async function loadLibrary() {
  let html = '';
  try {
    const res = await fetch('/recipes/', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    html = await res.text();
  } catch (e) {
    loadError = 'Could not read the recipe book.';
    return;
  }
  const seed = extractArray(html, 'const DEFAULT_RECIPES = [');
  if (!seed) { loadError = 'The recipe book loaded but its recipe list could not be read.'; return; }

  let merged = seed;
  try {
    const [a, b] = await Promise.all([
      fetch('/api/recipes', { cache: 'no-store' }),
      fetch('/api/recipes/deleted', { cache: 'no-store' })
    ]);
    if (a.ok) { const j = await a.json(); if (Array.isArray(j)) merged = mergeById(merged, j); }
    if (b.ok) { const j = await b.json(); if (Array.isArray(j)) { const gone = new Set(j); merged = merged.filter(r => !gone.has(r.id)); } }
  } catch (e) { /* offline is fine — the seed is enough */ }

  DISHES = merged.map(toDish).filter(Boolean);
}

function proteinOf(r) {
  if (PROTEIN_OVERRIDE[r.id]) return PROTEIN_OVERRIDE[r.id];
  if (r.section === 'chicken' || r.section === 'fish' || r.section === 'veg') return r.section;
  if (r.section !== 'starters' && r.section !== 'sides') return 'other';
  // Starters and sides are mixed, so read the title and ingredients.
  const text = r.title + ' ' + (r.ingredients || []).map(i => i.item).join(' ');
  for (const p of ['chicken', 'fish', 'other']) if (PROTEIN_WORDS[p].test(text)) return p;
  return 'veg';
}

function minutesOf(t) {
  if (!t) return null;
  const s = String(t).toLowerCase();
  let total = 0, found = false;
  const h = s.match(/([\d.]+)\s*(?:[–-]\s*[\d.]+)?\s*\+?\s*(?:hr|hour)/);
  if (h) { total += parseFloat(h[1]) * 60; found = true; }
  const m = s.match(/([\d.]+)\s*(?:[–-]\s*[\d.]+)?\s*(?:min)/);
  if (m) { total += parseFloat(m[1]); found = true; }
  return found ? total : null;
}

function tagsOf(r, course) {
  let tags = TAGS[r.id];
  if (!tags) {
    const text = (r.title || '') + ' ' + (r.description || '');
    const cal = parseInt(r.calories, 10) || null;
    tags = Object.keys(KEYWORDS).filter(k => KEYWORDS[k].test(text));
    if (course !== 'Main' || (cal && cal < 500)) tags.push('light');
    else if (cal && cal >= 800) tags.push('hearty');
    if ((cal && cal >= 850) || INDULGENT.test(text)) tags.push('treat');
    else if (cal && cal <= 550) tags.push('healthy');
  }
  tags = tags.slice();
  const mins = minutesOf(r.time);
  // "Plus overnight brine" and the like would make a 30-minute recipe look quick.
  const hasWait = /overnight|plus|marinat|chill|day before/i.test(r.time || '');
  if (mins && mins <= 30 && !hasWait && tags.indexOf('quick') === -1) tags.push('quick');
  return tags;
}

function photoOf(r) {
  if (Array.isArray(r.photos) && r.photos.length && r.photos[0].src) return r.photos[0].src;
  return typeof r.image === 'string' && r.image ? r.image : null;
}

function toDish(r) {
  if (!r.title || SKIP_SECTIONS.has(r.section)) return null;
  const course = COURSE_OVERRIDE[r.id] || COURSE[r.section] || 'Main';
  const protein = proteinOf(r);
  return {
    id: r.id, title: r.title, course,
    time: r.time && r.time !== '—' ? r.time : '',
    tags: [protein].concat(tagsOf(r, course)),
    photo: photoOf(r), noRecipe: !!r.noRecipe,
  };
}

/* ===========================================================================
 * The board and the results
 * ======================================================================== */
let picks = [];
const optionById = id => OPTIONS.find(o => o.id === id);
const COURSE_RANK = { Main: 0, Starter: 1, Side: 2 };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function toggle(id, el) {
  const at = picks.indexOf(id);
  if (at !== -1) { picks.splice(at, 1); }
  else {
    const opt = optionById(id);
    // Really hungry and not that hungry can't both be true, so one replaces the other.
    if (opt.not && picks.indexOf(opt.not) !== -1) picks.splice(picks.indexOf(opt.not), 1);
    if (picks.length >= MAX_PICKS) {
      el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope');
      document.getElementById('count').innerHTML = '<strong>That\'s 5</strong> — untick one to swap it';
      return;
    }
    picks.push(id);
  }
  renderBoard();
}

function renderBoard() {
  const full = picks.length >= MAX_PICKS;
  document.getElementById('stage').innerHTML =
    '<div class="board' + (full ? ' full' : '') + '">'
    + OPTIONS.map(o =>
        '<button class="tile' + (o.size ? ' ' + o.size : '') + (picks.indexOf(o.id) !== -1 ? ' on' : '')
        + '" style="--tint:' + o.tint + '" aria-pressed="' + (picks.indexOf(o.id) !== -1) + '"'
        + ' onclick="toggle(\'' + o.id + '\', this)">'
        + '<span class="emoji">' + o.emoji + '</span><span class="label">' + esc(o.label) + '</span></button>').join('')
    + '</div>'
    + '<p class="order-in">Can\'t face cooking? <a href="' + DELIVEROO_URL + '" target="_blank" rel="noopener">Open Deliveroo</a></p>';
  document.getElementById('confirmBar').hidden = false;
  document.getElementById('count').innerHTML = picks.length
    ? '<strong>' + picks.length + '</strong> of ' + MAX_PICKS + ' picked'
    : 'Pick up to ' + MAX_PICKS;
  document.getElementById('confirmBtn').disabled = !picks.length;
}

/* A recipe has to match at least two picks to be shown — or the one pick,
 * if only one was made. */
function minHits() { return Math.min(2, picks.length); }

function ranked() {
  return DISHES
    .map(d => ({ d, hits: picks.filter(p => d.tags.indexOf(p) !== -1) }))
    .filter(x => x.hits.length >= minHits())
    .sort((a, b) => b.hits.length - a.hits.length
      || COURSE_RANK[a.d.course] - COURSE_RANK[b.d.course]
      || a.d.title.localeCompare(b.d.title));
}

function dishCard({ d, hits }) {
  const protein = optionById(d.tags[0]);
  const thumb = d.photo
    ? '<div class="thumb" style="background-image:url(\'' + esc(d.photo) + '\')"></div>'
    : '<div class="thumb">' + protein.emoji + '</div>';
  const pills = hits.map(id => {
    const o = optionById(id);
    return '<span class="pill" style="--tint:' + o.tint + '">' + esc(o.label) + '</span>';
  }).join('');
  return '<a class="dish" id="dish-' + esc(d.id) + '" href="/recipes/#recipe-' + encodeURIComponent(d.id) + '">'
    + thumb + '<div class="dish-body">'
    + '<div class="dish-top"><div class="dish-title">' + esc(d.title) + '</div>'
    + '<span class="score">' + hits.length + '/' + picks.length + '</span></div>'
    + '<div class="dish-meta"><span class="course">' + d.course + '</span>'
    + (d.time ? '<span>· ' + esc(d.time) + '</span>' : '')
    + (d.noRecipe ? '<span class="pill" style="--tint:var(--surface2)">No recipe written yet</span>' : '') + '</div>'
    + '<div class="dish-meta">' + pills + '</div>'
    + '</div></a>';
}

function renderResults() {
  document.getElementById('confirmBar').hidden = true;
  const list = ranked();
  const chosen = '<div class="chosen">' + picks.map(id => {
    const o = optionById(id);
    return '<span class="chip" style="--tint:' + o.tint + '">' + o.emoji + ' ' + esc(o.label) + '</span>';
  }).join('') + '</div>';
  const back = '<div class="footer-actions"><button class="text-btn" onclick="changeChoices()">← Change choices</button>'
    + '<a class="text-btn" href="' + DELIVEROO_URL + '" target="_blank" rel="noopener">None of these — open Deliveroo</a></div>';
  if (!list.length) {
    document.getElementById('stage').innerHTML = chosen + '<div class="empty-note">Nothing in the book matches more than one of those yet.</div>' + back;
    return;
  }
  document.getElementById('stage').innerHTML = chosen
    + '<div class="results-head"><span class="count">' + list.length + ' recipe' + (list.length === 1 ? '' : 's') + ', best match first</span></div>'
    + '<div class="list">' + list.map(dishCard).join('') + '</div>' + back;
}

function confirmChoices() {
  if (!picks.length) return;
  if (picks.indexOf('hearty') !== -1 && picks.indexOf('treat') !== -1) { startParty(); return; }
  // The picks go in the URL so the back button returns to the board, and a
  // shortlist can be sent as a link.
  history.pushState(null, '', '#' + picks.join(','));
  renderResults();
  window.scrollTo({ top: 0 });
}

function changeChoices() {
  history.pushState(null, '', location.pathname);
  renderBoard();
  window.scrollTo({ top: 0 });
}

function readHash() {
  picks = decodeURIComponent(location.hash.slice(1)).split(',').filter(id => optionById(id)).slice(0, MAX_PICKS);
}
window.addEventListener('popstate', () => { readHash(); route(); });

function route() {
  if (location.hash.length > 1 && picks.length) renderResults();
  else renderBoard();
}

/* ===========================================================================
 * Takeaway party: really hungry + not that healthy
 * ======================================================================== */
let partyTimers = [];
let confettiFrame = null;

function startParty() {
  const party = document.getElementById('party');
  document.getElementById('partyGo').href = DELIVEROO_URL;
  party.classList.add('on');
  document.body.style.overflow = 'hidden';
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) runConfetti();
  let n = 4;
  const label = document.getElementById('partyCountdown');
  const tick = () => {
    label.textContent = n > 0 ? 'Really hungry and not that healthy. Opening Deliveroo in ' + n + '…' : 'Opening Deliveroo…';
    if (n-- <= 0) { location.href = DELIVEROO_URL; return; }
    partyTimers.push(setTimeout(tick, 1000));
  };
  tick();
}

function stopParty() {
  partyTimers.forEach(clearTimeout); partyTimers = [];
  cancelAnimationFrame(confettiFrame);
  document.getElementById('party').classList.remove('on');
  document.body.style.overflow = '';
  history.pushState(null, '', '#' + picks.join(','));
  renderResults();
}

function runConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  ctx.scale(dpr, dpr);
  const EMOJI = ['🍕', '🍔', '🍟', '🌮', '🍜', '🥡', '🍗', '🎉', '⭐', '💸'];
  const COLOURS = ['#FFD23F', '#FFFFFF', '#1A1714', '#00CCBC', '#FF3D7F'];
  const bits = Array.from({ length: 140 }, (_, i) => ({
    x: Math.random() * innerWidth, y: -Math.random() * innerHeight,
    vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 4,
    r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
    emoji: i % 3 === 0 ? EMOJI[i % EMOJI.length] : null,
    colour: COLOURS[i % COLOURS.length], size: 8 + Math.random() * 10,
  }));
  const draw = () => {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const b of bits) {
      b.x += b.vx; b.y += b.vy; b.r += b.vr;
      if (b.y > innerHeight + 30) { b.y = -30; b.x = Math.random() * innerWidth; }
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
      if (b.emoji) { ctx.font = (b.size * 2.2) + 'px serif'; ctx.fillText(b.emoji, -b.size, b.size); }
      else { ctx.fillStyle = b.colour; ctx.fillRect(-b.size / 2, -b.size / 4, b.size, b.size / 2); }
      ctx.restore();
    }
    confettiFrame = requestAnimationFrame(draw);
  };
  draw();
}

function toggleMainMenu(e) {
  e.stopPropagation();
  document.getElementById('mainMenuDropdown').classList.toggle('open');
}
document.addEventListener('click', () => document.getElementById('mainMenuDropdown').classList.remove('open'));

(async function init() {
  await loadLibrary();
  if (loadError || !DISHES.length) {
    document.getElementById('stage').innerHTML = '<div class="empty-note">' + esc(loadError || 'No recipes found.')
      + '<br><br><a href="/recipes/" style="color:var(--accent);">Open the recipe book</a></div>';
    return;
  }
  readHash();
  route();
})();
</script>
</body></html>
