<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cocktail Menu</title>
<meta name="description" content="What can I get you? Tonight's cocktails.">
<meta name="theme-color" content="#10241E">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* A guest-facing page: it's the link sent to visitors, so it has none of the
   * recipe book's header or buttons. Dark green and brass, like the printed
   * menu. Phone first. */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #10241E; --panel: #152E27; --ink: #F1EBDD; --muted: #BDB6A5; --faint: #8E9A92;
    --brass: #C9A45C; --brass-soft: rgba(201,164,92,0.14); --line: rgba(201,164,92,0.35);
    --off: #D9967A;
    --display: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
    --body: 'Jost', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
    color-scheme: dark;
  }
  html { background: var(--bg); }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; min-height: 100vh; }
  .wrap { max-width: 980px; margin: 0 auto; padding: max(40px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(64px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 40px; }

  header { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding-top: 8px; }
  .eyebrow { font-size: 12px; font-weight: 500; letter-spacing: 0.32em; text-transform: uppercase; color: var(--brass); }
  h1 { font-family: var(--display); font-style: italic; font-weight: 400; font-size: clamp(44px, 11vw, 76px); line-height: 1; text-wrap: balance; }
  .orn { display: flex; align-items: center; gap: 12px; width: 200px; }
  .orn i { flex: 1; height: 1px; background: var(--brass); }
  .orn b { width: 7px; height: 7px; transform: rotate(45deg); border: 1px solid var(--brass); }
  .lede { color: var(--muted); font-weight: 300; font-size: 17px; max-width: 34ch; text-wrap: balance; }

  .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chip { font: 400 14px/1 var(--body); letter-spacing: 0.04em; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 0 16px; min-height: 40px; cursor: pointer; }
  .chip:hover { border-color: var(--brass); }
  .chip[aria-pressed="true"] { background: var(--brass); border-color: var(--brass); color: var(--bg); font-weight: 500; }
  .chip:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
  .tally { text-align: center; font-size: 13px; color: var(--faint); letter-spacing: 0.04em; margin-top: -24px; font-variant-numeric: tabular-nums; }

  .group h2 { display: flex; align-items: center; gap: 16px; font-size: 12px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: var(--brass); margin-bottom: 6px; }
  .group h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .group-note { font-family: var(--display); font-style: italic; color: var(--muted); font-size: 16px; margin-bottom: 18px; }
  .drinks { list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; }
  .drink { display: flex; flex-direction: column; gap: 4px; padding: 18px 0; border-bottom: 1px solid rgba(201,164,92,0.16); min-width: 0; }
  .dn { font-family: var(--display); font-size: 25px; font-weight: 500; line-height: 1.15; }
  .db { font-size: 15.5px; font-weight: 300; color: var(--ink); opacity: 0.92; }
  .ds { font-size: 13px; color: var(--muted); letter-spacing: 0.02em; }
  .drink.off .dn { text-decoration: line-through; text-decoration-color: var(--off); text-decoration-thickness: 1.5px; color: var(--muted); }
  .drink.off .db, .drink.off .ds { opacity: 0.5; }
  .why { align-self: flex-start; margin-top: 6px; font-size: 12.5px; letter-spacing: 0.02em; color: var(--off); border: 1px solid rgba(217,150,122,0.45); border-radius: 999px; padding: 3px 11px; }
  .none { text-align: center; color: var(--muted); font-family: var(--display); font-style: italic; font-size: 19px; padding: 12px 0 0; }

  .owner { text-align: center; font-size: 13px; color: var(--faint); border-top: 1px solid var(--line); padding-top: 20px; }
  .owner a { color: var(--brass); }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 680px) {
    .wrap { gap: 32px; }
    .drinks { grid-template-columns: minmax(0, 1fr); }
    .drink { padding: 16px 0; }
    .dn { font-size: 23px; }
    .tally { margin-top: -18px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">Cocktail menu</p>
    <h1>What can I get you?</h1>
    <div class="orn" aria-hidden="true"><i></i><b></b><i></i></div>
    <p class="lede">Have a look and tell me what you fancy. Anything crossed out isn't possible tonight.</p>
  </header>

  <div class="filters" role="group" aria-label="Show drinks with">
    <button class="chip" type="button" data-f="all" aria-pressed="true">Everything</button>
    <button class="chip" type="button" data-f="gin" aria-pressed="false">Gin</button>
    <button class="chip" type="button" data-f="vodka" aria-pressed="false">Vodka</button>
    <button class="chip" type="button" data-f="whisky" aria-pressed="false">Whisky</button>
    <button class="chip" type="button" data-f="tequila" aria-pressed="false">Tequila</button>
    <button class="chip" type="button" data-f="long" aria-pressed="false">Long &amp; light</button>
    <button class="chip" type="button" data-f="after" aria-pressed="false">After dinner</button>
  </div>
  <p class="tally" id="tally" aria-live="polite"></p>

  <section class="group" id="g-classic" aria-labelledby="h-classic">
    <h2 id="h-classic">The Classics</h2>
    <p class="group-note">The famous ones.</p>
    <ul class="drinks" id="classic"></ul>
  </section>

  <section class="group" id="g-more" aria-labelledby="h-more">
    <h2 id="h-more">Something Different</h2>
    <p class="group-note">Less well known, and worth a try.</p>
    <ul class="drinks" id="more"></ul>
  </section>

  <p class="none" id="none" hidden>Nothing like that tonight. Try another filter.</p>

  <p class="owner" id="owner" hidden></p>
</div>

<script src="/assets/bar-data.js"></script>
<script>
/* Guest cocktail menu. Drinks and what each needs come from
 * /assets/bar-data.js; what's in comes from /api/bar-stock (ticked on
 * /recipes/bar-stock/). A drink with anything missing is crossed out with a
 * note, and moved below the ones that can be made. If the stock can't be
 * read, or has never been saved, nothing is crossed out. */
const { DRINKS, missing, listLabels } = window.BAR;
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

let have = null;          // Set of item ids, or null when unknown
let filter = 'all';

function render() {
  const shown = DRINKS.filter(d => filter === 'all' || d.tags.includes(filter));
  let avail = 0;
  ['classic', 'more'].forEach(g => {
    const rows = shown.filter(d => d.group === g).map(d => ({ d, miss: have ? missing(d, have) : [] }));
    rows.sort((a, b) => (a.miss.length > 0) - (b.miss.length > 0));
    avail += rows.filter(r => !r.miss.length).length;
    document.getElementById(g).innerHTML = rows.map(({ d, miss }) =>
      '<li class="drink' + (miss.length ? ' off' : '') + '">'
      + '<h3 class="dn">' + esc(d.name) + (miss.length ? '<span class="sr"> (not available tonight)</span>' : '') + '</h3>'
      + '<p class="db">' + esc(d.blurb) + '</p>'
      + '<p class="ds">' + esc(d.spec) + '</p>'
      + (miss.length ? '<p class="why">Not tonight: out of ' + esc(listLabels(miss)) + '</p>' : '')
      + '</li>').join('');
    document.getElementById('g-' + g).hidden = rows.length === 0;
  });
  document.getElementById('none').hidden = shown.length > 0;
  document.getElementById('tally').textContent = have
    ? avail + ' of ' + shown.length + ' available tonight'
    : shown.length + ' drinks';
}

document.querySelectorAll('.chip').forEach(btn => btn.addEventListener('click', () => {
  filter = btn.dataset.f;
  document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
  render();
}));

render();

fetch('/api/bar-stock', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : null)
  .then(s => { if (s && s.updatedAt) { have = new Set(s.have); render(); } })
  .catch(() => {});

/* Only the owner sees where the crossings-out come from. */
fetch('/api/session', { cache: 'no-store', credentials: 'same-origin' })
  .then(r => r.ok ? r.json() : null)
  .then(s => {
    if (!(s && s.signedIn)) return;
    const o = document.getElementById('owner');
    o.innerHTML = 'You\'re signed in. Guests can\'t see this line. What\'s crossed out comes from <a href="/recipes/bar-stock/">Bar Stock</a>.';
    o.hidden = false;
  })
  .catch(() => {});
</script>
</body>
</html>
