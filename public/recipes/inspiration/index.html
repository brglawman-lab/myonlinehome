<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspiration — Recipe Book</title>
<meta name="description" content="A handful of recipes recently published by UK food websites, with links to the full recipe.">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F7F4EF; --surface: #FFFFFF; --surface2: #F0EDE7;
    --border: #E2DDD5; --border-strong: #C8C2B8;
    --text: #1A1714; --text-muted: #7A7470; --text-faint: #B0AAA4;
    --accent: #2C5F2E; --accent-light: #EAF0EA; --accent-text: #1A3D1B;
    --radius: 4px; --radius-lg: 8px;
    --header-h: 64px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.6; }

  /* ---- header, matched to the recipe book ---- */
  .site-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; position: sticky; top: 0; z-index: 50; }
  .header-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: var(--header-h); gap: 1.5rem; }
  .logo { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--text); white-space: nowrap; flex-shrink: 0; }
  .logo span { color: var(--accent); font-style: italic; }

  .main { max-width: 1100px; margin: 0 auto; padding: 2rem 2rem 5rem; }
  .intro { margin-bottom: 1.75rem; }
  .intro h1 { font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 400; line-height: 1.2; margin-bottom: 0.4rem; }
  .intro p { color: var(--text-muted); max-width: 68ch; }

  /* ---- one block per site ---- */
  .source { margin-bottom: 2.5rem; }
  .source-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 1rem; }
  .source-head h2 { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 400; }
  .source-head a { font-size: 13px; color: var(--text-muted); text-decoration: none; }
  .source-head a:hover { color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; text-decoration: none; color: inherit; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(20,16,12,0.08); border-color: var(--accent); }
  .card-photo { aspect-ratio: 4 / 3; background: var(--surface2); }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card-title { font-family: 'Playfair Display', serif; font-size: 17px; line-height: 1.3; }
  .card-summary { font-size: 13.5px; color: var(--text-muted); line-height: 1.5; }
  .card-foot { margin-top: auto; padding-top: 4px; font-size: 12px; color: var(--text-faint); }
  .note { color: var(--text-muted); font-size: 14px; }
  .small-print { margin-top: 1rem; font-size: 12.5px; color: var(--text-faint); max-width: 70ch; }

  @media (max-width: 640px) {
    .site-header, .main { padding-left: 1rem; padding-right: 1rem; }
    .intro h1 { font-size: 27px; }
    .cards { grid-template-columns: 1fr; }
    .card { flex-direction: row; }
    .card-photo { aspect-ratio: auto; width: 110px; flex-shrink: 0; }
  }
</style>
</head>
<body>
<a href="/" id="mohome-back" aria-label="Back to My Online Home">&#8592; Home</a>
<style>
#mohome-back{position:fixed;top:12px;left:12px;z-index:99999;display:inline-block;
padding:7px 14px;border-radius:999px;background:rgba(250,248,244,0.96);color:#2d4a3e;
font:500 13px/1.2 'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
text-decoration:none;border:1px solid rgba(45,74,62,0.22);
box-shadow:0 2px 12px rgba(0,0,0,0.16);backdrop-filter:blur(6px);
transition:background .15s ease,color .15s ease}
#mohome-back:hover{background:#2d4a3e;color:#f5f0e8;border-color:#2d4a3e}
@media (max-width:720px){.site-header{padding-left:6.5rem}}
@media (min-width:721px) and (max-width:1340px){.site-header{padding-left:7.5rem}}
</style>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">Recipe <span>Book</span></div>
  </div>
</header>

<nav class="recipe-nav" id="recipeNav" data-current="inspiration"></nav>
<script src="/assets/recipe-nav.js"></script>

<main class="main">
  <div class="intro">
    <h1>Inspiration</h1>
    <p>A handful of recipes recently published by UK food websites. Each one links to the full recipe on the site that published it.</p>
  </div>
  <div id="sources"><p class="note">Fetching the latest recipes…</p></div>
  <p class="small-print" id="smallPrint"></p>
</main>

<script>
/* The list comes from /api/inspiration, which reads each site's RSS feed on
 * the server and caches the result for a few hours — see src/inspiration.js. */
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

function ago(iso) {
  if (!iso) return '';
  const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  return days <= 0 ? 'Today' : days === 1 ? 'Yesterday' : days < 14 ? days + ' days ago' : new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

function card(it, source) {
  return '<a class="card" href="' + esc(it.link) + '" target="_blank" rel="noopener">'
    + '<div class="card-photo">' + (it.image ? '<img src="' + esc(it.image) + '" alt="" loading="lazy" referrerpolicy="no-referrer">' : '') + '</div>'
    + '<div class="card-body">'
    + '<div class="card-title">' + esc(it.title) + '</div>'
    + (it.summary ? '<div class="card-summary">' + esc(it.summary) + '</div>' : '')
    + '<div class="card-foot">' + esc([source.name, ago(it.published)].filter(Boolean).join(' · ')) + ' ↗</div>'
    + '</div></a>';
}

(async function init() {
  const el = document.getElementById('sources');
  let data;
  try {
    const res = await fetch('/api/inspiration');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    el.innerHTML = '<p class="note">Couldn\'t fetch the latest recipes just now — try again in a little while.</p>';
    return;
  }
  el.innerHTML = data.sources.map(s =>
    '<section class="source">'
    + '<div class="source-head"><h2>' + esc(s.name) + '</h2><a href="' + esc(s.site) + '" target="_blank" rel="noopener">Visit site ↗</a></div>'
    + (s.items.length ? '<div class="cards">' + s.items.map(it => card(it, s)).join('') + '</div>' : '<p class="note">' + esc(s.error || 'Nothing new right now.') + '</p>')
    + '</section>'
  ).join('');
  document.getElementById('smallPrint').textContent = 'Headlines, summaries and pictures come from each site\'s public RSS feed and belong to their publishers. Last checked '
    + new Date(data.fetchedAt).toLocaleString('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit' }) + '.';
})();
</script>
</body>
</html>
