<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work in Progress</title>
<meta name="description" content="Ben Lawman — projects still being built.">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --warm-white: #faf8f4;
    --forest: #2d4a3e;
    --sage: #7a9e8e;
    --earth: #8b6f47;
    --rust: #c4622d;
    --amber: #d4a853;
    --charcoal: #2a2a2a;
    --mid-grey: #7a7a7a;
    --light-border: rgba(45,74,62,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--cream);
    color: var(--charcoal);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  #mohome-back {
    position: fixed; top: 14px; left: 14px; z-index: 999;
    display: inline-block; padding: 7px 14px; border-radius: 999px;
    background: rgba(250,248,244,0.96); color: var(--forest);
    font: 500 13px/1.2 'DM Sans', sans-serif; text-decoration: none;
    border: 1px solid rgba(45,74,62,0.22);
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    backdrop-filter: blur(6px);
    transition: background .15s ease, color .15s ease;
  }
  #mohome-back:hover { background: var(--forest); color: var(--warm-white); }

  header {
    padding: 5rem 1.5rem 2rem;
    max-width: 1080px; margin: 0 auto;
  }
  header h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(2.2rem, 6vw, 3.2rem);
    font-weight: 700; color: var(--forest);
    letter-spacing: -0.02em; margin-bottom: 0.5rem;
  }
  header p { font-size: 1rem; color: var(--mid-grey); max-width: 46ch; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 1.5rem; }
  .cards { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .card {
    display: flex; flex-direction: column;
    background: var(--warm-white);
    border: 1px solid var(--light-border);
    border-radius: 14px;
    padding: 1.75rem;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    box-shadow: 0 10px 28px rgba(45,74,62,0.12);
    border-color: var(--sage);
    outline: none;
  }
  .card-icon { margin-bottom: 1rem; line-height: 0; }
  .card-icon .ic { width: 30px; height: 30px; display: block; }
  .card-icon.wl { color: var(--sage); }
  .card h2 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.5rem; font-weight: 700; color: var(--forest);
    margin-bottom: 0.5rem; letter-spacing: -0.01em;
  }
  .card p { font-size: 0.94rem; color: var(--mid-grey); flex: 1; }
  .card .go {
    margin-top: 1.25rem; font-size: 0.85rem; font-weight: 500;
    color: var(--rust); letter-spacing: 0.02em;
  }
  .card .go::after { content: ' →'; }
  .meta {
    margin-top: 0.9rem; padding-top: 0.9rem;
    border-top: 1px solid var(--light-border);
    font-size: 0.78rem; color: var(--sage); letter-spacing: 0.02em;
  }

  footer {
    margin-top: 4rem; padding: 2rem 1.5rem 3rem;
    border-top: 1px solid var(--light-border);
    text-align: center; font-size: 0.82rem; color: var(--mid-grey);
  }
  footer a { color: var(--forest); border-bottom: 1px solid var(--light-border); }
</style>
</head>
<body>

<a id="mohome-back" href="/" aria-label="Back to My Online Home">&#8592; Home</a>

<header>
  <h1>Work in Progress</h1>
  <p>Projects that are still being built out.</p>
</header>

<div class="wrap">
  <div class="cards">

    <a class="card" href="/wildlife/">
      <div class="card-icon wl"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.2 3.8c-3.6-1.2-9 .4-12.2 3.6-2.6 2.6-3.2 6.2-2 8.8L3 20.2M8 16c2.6 1.2 6.2.6 8.8-2 3.2-3.2 4.8-8.6 3.4-12.2"/><path d="M14.5 9.5 8.4 15.6M7.5 12.5H12M12 7.5V12"/></svg></div>
      <h2>Yorkshire Wildlife</h2>
      <p>A checklist of every wild vertebrate you can find in Yorkshire, with a county map and a running log of what I've actually seen.</p>
      <div class="meta">468 species · 4 counties</div>
      <div class="go">Browse and log</div>
    </a>

  </div>
</div>

<footer>
  Built and maintained with Claude · <a href="/">home</a>
</footer>

</body>
</html>
