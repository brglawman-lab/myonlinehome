<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — My Online Home</title>
<meta name="description" content="Recipes, food storage, and West Yorkshire food markets, at a glance.">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --warm-white: #faf8f4;
    --forest: #2d4a3e;
    --sage: #7a9e8e;
    --earth: #8b6f47;
    --rust: #c4622d;
    --amber: #d4a853;
    --charcoal: #2a2a2a;
    --mid-grey: #7a7a7a;
    --light-border: rgba(45,74,62,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--cream);
    color: var(--charcoal);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 1.5rem 3rem; }

  /* ---------- header ---------- */
  .page-head { padding: 3.5rem 1.5rem 1rem; text-align: center; }
  .page-head h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(2.2rem, 6vw, 3rem); font-weight: 700; color: var(--forest);
    letter-spacing: -0.02em;
  }
  .page-head p { color: var(--mid-grey); margin-top: 0.4rem; font-size: 0.95rem; }

  .section-label {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--sage); font-weight: 500;
    margin: 3rem 0 1.25rem;
  }

  /* ---------- dashboard widgets ---------- */
  .dash-grid { display: grid; gap: 1.1rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .widget {
    background: var(--warm-white);
    border: 1px solid var(--light-border);
    border-radius: 14px;
    padding: 1.4rem 1.5rem;
    display: flex; flex-direction: column;
  }
  .widget-label {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--sage); font-weight: 500; margin-bottom: 0.6rem;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .widget-title {
    font-family: 'Playfair Display', Georgia, serif; font-size: 1.2rem; font-weight: 700;
    color: var(--forest); margin-bottom: 0.5rem; line-height: 1.3;
  }
  .widget-body { font-size: 0.9rem; color: var(--charcoal); flex: 1; }
  .widget-body p { margin: 0 0 0.4rem; }
  .widget-body p:last-child { margin-bottom: 0; }
  .widget-muted { color: var(--mid-grey); font-style: italic; }
  .widget-foot { margin-top: 0.9rem; padding-top: 0.8rem; border-top: 1px solid var(--light-border); font-size: 0.82rem; font-weight: 500; color: var(--rust); }
  .widget-foot a::after { content: ' →'; }
  .event-row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .event-row .day { color: var(--mid-grey); flex-shrink: 0; font-size: 0.82rem; }
  .tag-chip { display: inline-block; font-size: 0.68rem; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--cream); color: var(--earth); margin-left: 6px; }
  .produce-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .produce-chip { font-size: 0.82rem; background: var(--cream); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .room-row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 0.88rem; }
  .room-row .room-status { color: var(--mid-grey); font-size: 0.82rem; text-align: right; }

  /* ---------- signed-in section ---------- */
  .admin-only[hidden] { display: none; }
  .admin-label { display: flex; align-items: center; gap: 10px; }
  .admin-label .pill { font-size: 0.62rem; letter-spacing: 0.1em; padding: 2px 8px; border-radius: 999px; background: var(--forest); color: var(--cream); }

  /* ---------- bin day ---------- */
  .bins { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; text-align: center; }
  .bin { display: flex; flex-direction: column; align-items: center; }
  .bin svg { width: 72px; height: 92px; display: block; }
  .bin-name { font-weight: 500; font-size: 0.88rem; margin-top: 0.4rem; color: var(--charcoal); }
  .bin-what { font-size: 0.72rem; color: var(--mid-grey); }
  .bin-date { font-family: 'Playfair Display', Georgia, serif; font-size: 1.05rem; font-weight: 700; color: var(--forest); margin-top: 0.3rem; line-height: 1.2; }
  .bin-when { font-size: 0.78rem; color: var(--rust); font-weight: 500; }
  .bin-when.soon { color: var(--rust); }
  .bin-when.later { color: var(--mid-grey); font-weight: 400; }
  .bin-none { font-size: 0.82rem; color: var(--mid-grey); font-style: italic; margin-top: 0.3rem; }
  .bin-then { margin-top: 0.8rem; font-size: 0.8rem; color: var(--mid-grey); text-align: center; }
  .bin-setup label { display: block; font-size: 0.82rem; color: var(--mid-grey); margin-bottom: 0.35rem; }
  .bin-setup .row { display: flex; gap: 6px; }
  .bin-setup input, .bin-setup select {
    font: inherit; font-size: 0.9rem; padding: 0.45rem 0.6rem; border: 1px solid var(--light-border);
    border-radius: 8px; background: #fff; color: var(--charcoal); min-width: 0; flex: 1; width: 100%;
  }
  .bin-setup button, .link-btn {
    font: inherit; font-size: 0.85rem; font-weight: 500; padding: 0.45rem 0.9rem; border-radius: 8px;
    border: 1px solid var(--forest); background: var(--forest); color: var(--cream); cursor: pointer;
  }
  .bin-setup select { margin-top: 0.6rem; }
  .bin-setup .row + .row { margin-top: 0.6rem; }
  .bin-msg { font-size: 0.8rem; color: var(--rust); margin-top: 0.5rem; min-height: 1em; }
  .link-btn { background: none; border: none; color: var(--rust); padding: 0; font-size: 0.82rem; }



  @media (max-width: 600px) {
    .page-head { padding: 3rem 1.25rem 0.75rem; }
  }
</style>
</head>
<body>
<a href="/" id="mohome-back" aria-label="Back to My Online Home">&#8592; Home</a>
<style>
#mohome-back{position:fixed;top:12px;left:12px;z-index:99999;display:inline-block;
padding:7px 14px;border-radius:999px;background:rgba(250,248,244,0.96);color:#2d4a3e;
font:500 13px/1.2 'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
text-decoration:none;border:1px solid rgba(45,74,62,0.22);
box-shadow:0 2px 12px rgba(0,0,0,0.16);backdrop-filter:blur(6px);
transition:background .15s ease,color .15s ease}
#mohome-back:hover{background:#2d4a3e;color:#f5f0e8;border-color:#2d4a3e}
</style>

<div class="page-head">
  <h1>Dashboard</h1>
  <p>What's on and what's in season.</p>
</div>

<div class="wrap">
  <p class="section-label">Right now</p>
  <div class="dash-grid" id="dashGrid">
    <div class="widget"><div class="widget-label">Loading…</div></div>
  </div>

  <div class="admin-only" id="adminSection" hidden>
    <p class="section-label admin-label">At home <span class="pill">Signed in</span></p>
    <div class="dash-grid" id="adminGrid"></div>
  </div>

</div>


<script>
/* ===========================================================================
 * Food dashboard — pulls live data from the recipe book and the Farmer's
 * Markets guide (same page-scraping approach the Meal Builder and Food
 * Storage pages use: fetch the page's HTML, lift a named const array out of
 * it) and renders a handful of "what's relevant right now" widgets. When the
 * browser is signed in, a second section adds bin day (/admin/api/bins) and
 * the storage watch (the storage-rooms/readings API). Nothing here writes anything — it's
 * read-only, so no sync/offline-queue machinery is needed.
 * ======================================================================== */
function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

function extractArray(html, marker) {
  const at = html.indexOf(marker);
  if (at < 0) return null;
  const open = at + marker.length - 1;
  const close = html.indexOf('\n];', open);
  if (close < 0) return null;
  try { return (new Function('return ' + html.slice(open, close + 2) + ';'))(); }
  catch (e) { console.warn('Could not parse ' + marker, e); return null; }
}
function fmtISODate(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), da = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + da;
}
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function isInSeasonForMonth(p, month) {
  if (p.startMonth <= p.endMonth) return month >= p.startMonth && month <= p.endMonth;
  return month >= p.startMonth || month <= p.endMonth;
}
function allDates(market) {
  const out = [];
  for (const k in market) { if (/^dates\d{4}$/.test(k) && Array.isArray(market[k])) out.push(...market[k]); }
  return out;
}
const EVENT_TYPE_LABEL = { 'farmers-market': 'Market', 'food-festival': 'Food festival', 'beer-festival': 'Beer festival' };

/* ---- data loaders ---- */
async function loadMarkets() {
  try {
    const res = await fetch('/wyfood/', { cache: 'no-cache' });
    if (!res.ok) return null;
    const html = await res.text();
    return extractArray(html, 'const MARKETS = [');
  } catch (e) { return null; }
}
async function loadRecipeData() {
  try {
    const res = await fetch('/recipes/', { cache: 'no-cache' });
    if (!res.ok) return null;
    const html = await res.text();
    return {
      seasonal: extractArray(html, 'const SEASONAL_PRODUCE = [') || [],
      foraging: extractArray(html, 'const FORAGING_ITEMS = [') || [],
    };
  } catch (e) { return null; }
}
async function loadStorage() {
  try {
    const [a, b] = await Promise.all([
      fetch('/api/storage-rooms', { cache: 'no-store' }),
      fetch('/api/storage-readings', { cache: 'no-store' }),
    ]);
    const rooms = a.ok ? await a.json() : [];
    const readings = b.ok ? await b.json() : [];
    return { rooms: Array.isArray(rooms) ? rooms : [], readings: Array.isArray(readings) ? readings : [] };
  } catch (e) { return { rooms: [], readings: [] }; }
}

/* ---- widget builders — each returns an HTML string for one .widget card ---- */
function widget(label, title, bodyHtml, footHtml) {
  return '<div class="widget"><div class="widget-label">' + label + '</div>'
    + (title ? '<div class="widget-title">' + title + '</div>' : '')
    + '<div class="widget-body">' + bodyHtml + '</div>'
    + (footHtml ? '<div class="widget-foot">' + footHtml + '</div>' : '')
    + '</div>';
}

function marketsWidget(markets) {
  if (!markets) {
    return widget('This weekend', "Markets &amp; festivals", '<p class="widget-muted">Could not reach the Farmer\'s Markets guide.</p>', '<a href="/wyfood/">Open WY Farmer\'s Markets</a>');
  }
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const day = today.getDay();
  const sat = new Date(today);
  if (day === 0) sat.setDate(sat.getDate() - 1); else sat.setDate(sat.getDate() + (6 - day));
  const sun = new Date(sat); sun.setDate(sun.getDate() + 1);
  const satKey = fmtISODate(sat), sunKey = fmtISODate(sun);
  const satLabel = sat.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  const sunLabel = sun.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

  const rows = [];
  markets.forEach((m) => {
    const dates = allDates(m);
    if (dates.includes(satKey)) rows.push({ day: satLabel, m });
    if (dates.includes(sunKey)) rows.push({ day: sunLabel, m });
  });

  const body = rows.length
    ? rows.map((r) => '<div class="event-row"><span>' + escapeHtml(r.m.name) + '<span class="tag-chip">' + escapeHtml(EVENT_TYPE_LABEL[r.m.eventType] || r.m.eventType) + '</span></span><span class="day">' + r.day + '</span></div>').join('')
    : '<p class="widget-muted">Nothing on this weekend.</p>';

  return widget('This weekend', satLabel + ' &ndash; ' + sunLabel, body, '<a href="/wyfood/">Open WY Farmer\'s Markets</a>');
}

function festivalsWidget(markets) {
  if (!markets) return '';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const cutoff = new Date(today); cutoff.setMonth(cutoff.getMonth() + 3);
  const events = [];
  markets.forEach((m) => {
    if (m.eventType === 'farmers-market') return;
    allDates(m).forEach((d) => {
      const dt = new Date(d);
      if (dt >= today && dt <= cutoff) events.push({ date: dt, m });
    });
  });
  events.sort((a, b) => a.date - b.date);
  const seen = new Set();
  const upcoming = events.filter((e) => (seen.has(e.m.id) ? false : (seen.add(e.m.id), true))).slice(0, 4);

  const body = upcoming.length
    ? upcoming.map((e) => '<div class="event-row"><span>' + escapeHtml(e.m.name) + '</span><span class="day">' + e.date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + '</span></div>').join('')
    : '<p class="widget-muted">Nothing in the next few months.</p>';

  return widget('Coming up', 'Food &amp; drink festivals', body, '<a href="/wyfood/">See the full calendar</a>');
}

function seasonWidget(items, month, monthName, hashTarget, label) {
  const inSeason = items.filter((p) => isInSeasonForMonth(p, month));
  const shown = inSeason.slice(0, 14);
  const body = inSeason.length
    ? '<div class="produce-list">' + shown.map((p) => '<span class="produce-chip">' + p.icon + ' ' + escapeHtml(p.name) + '</span>').join('') + (inSeason.length > shown.length ? '<span class="produce-chip">+' + (inSeason.length - shown.length) + ' more</span>' : '') + '</div>'
    : '<p class="widget-muted">Nothing listed for ' + monthName + '.</p>';
  return widget(label, monthName, body, '<a href="/recipes/#' + hashTarget + '">See the full calendar</a>');
}

function storageWidget(storage) {
  if (!storage.rooms.length) {
    return widget('Storage watch', 'No rooms set up yet', '<p class="widget-muted">Add a pantry, store or cellar to start tracking conditions.</p>', '<a href="/admin/storage/">Set up the room tracker</a>');
  }
  const now = Date.now();
  const rows = storage.rooms.map((room) => {
    const readings = storage.readings.filter((r) => r.roomId === room.id);
    if (!readings.length) return '<div class="room-row"><span>' + escapeHtml(room.name) + '</span><span class="room-status">No readings yet</span></div>';
    const latest = readings.reduce((a, b) => (new Date(a.recordedAt) > new Date(b.recordedAt) ? a : b));
    const days = Math.floor((now - new Date(latest.recordedAt).getTime()) / 86400000);
    const when = days <= 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago';
    const readingBits = [latest.tempC != null ? latest.tempC + '°C' : '', latest.humidityPct != null ? latest.humidityPct + '%' : ''].filter(Boolean).join(', ');
    return '<div class="room-row"><span>' + escapeHtml(room.name) + '</span><span class="room-status">' + when + (readingBits ? ' · ' + readingBits : '') + '</span></div>';
  });
  return widget('Storage watch', null, rows.join(''), '<a href="/admin/storage/">Log a reading</a>');
}

/* ---- signed-in only: bin day ---- */
const BIN_INFO = {
  green: { name: 'Green bin', what: 'Recycling', body: '#3e7a3a', lid: '#2f6230', shade: '#336b30' },
  black: { name: 'Black bin', what: 'General waste', body: '#2b2b2b', lid: '#141414', shade: '#202020' },
  brown: { name: 'Brown bin', what: 'Garden waste', body: '#7a4a26', lid: '#5c361a', shade: '#6a3f1f' },
};
/* A wheelie bin, drawn rather than loaded so it costs nothing and stays sharp. */
function binSvg(kind) {
  const c = BIN_INFO[kind];
  return '<svg viewBox="0 0 72 92" role="img" aria-label="' + c.name + '">'
    + '<rect x="6" y="5" width="60" height="4" rx="2" fill="' + c.lid + '"/>'           /* handle bar */
    + '<path d="M4 12 h64 a3 3 0 0 1 3 3 v4 h-70 v-4 a3 3 0 0 1 3 -3z" fill="' + c.lid + '"/>' /* lid */
    + '<path d="M8 20 h56 l-5 58 a4 4 0 0 1 -4 3.6 h-38 a4 4 0 0 1 -4 -3.6z" fill="' + c.body + '"/>' /* body */
    + '<path d="M20 28 v42 M36 28 v42 M52 28 v42" stroke="' + c.shade + '" stroke-width="3" stroke-linecap="round"/>'
    + '<circle cx="18" cy="84" r="6" fill="#3a3a3a"/><circle cx="18" cy="84" r="2.2" fill="#9a9a9a"/>'
    + '<circle cx="54" cy="84" r="6" fill="#3a3a3a"/><circle cx="54" cy="84" r="2.2" fill="#9a9a9a"/>'
    + '</svg>';
}
function daysFrom(todayIso, iso) {
  return Math.round((Date.parse(iso + 'T12:00:00Z') - Date.parse(todayIso + 'T12:00:00Z')) / 86400000);
}
function binDateHtml(c, todayIso) {
  const d = new Date(c.date + 'T12:00:00Z');
  const label = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
  const n = daysFrom(todayIso, c.date);
  const when = n <= 0 ? 'Today' : n === 1 ? 'Tomorrow' : n < 7 ? 'This ' + d.toLocaleDateString('en-GB', { weekday: 'long', timeZone: 'UTC' }) : 'In ' + n + ' days';
  return '<div class="bin-date">' + label + '</div><div class="bin-when ' + (n <= 1 ? 'soon' : 'later') + '">' + when + '</div>';
}
function binCard(kind, c, todayIso, emptyText, note) {
  const i = BIN_INFO[kind];
  return '<div class="bin">' + binSvg(kind)
    + '<div class="bin-name">' + i.name + '</div><div class="bin-what">' + i.what + '</div>'
    + (c ? binDateHtml(c, todayIso) : '<div class="bin-none">' + emptyText + '</div>')
    + (note ? '<div class="bin-what">' + note + '</div>' : '')
    + '</div>';
}

function binsWidget(data) {
  if (!data) {
    return widget('Bin day', null, '<p class="widget-muted">Could not reach the bin day service.</p>', '<a href="https://www.leeds.gov.uk/bins-and-recycling/check-your-bin-day" target="_blank" rel="noopener">Check on leeds.gov.uk</a>');
  }
  if (!data.configured) {
    return widget('Bin day', 'Set your address', binSetupHtml(), '');
  }
  if (data.error) {
    return widget('Bin day', null, '<p class="widget-muted">Leeds City Council did not answer just now (' + escapeHtml(data.error) + ').</p>',
      '<a href="https://www.leeds.gov.uk/bins-and-recycling/check-your-bin-day" target="_blank" rel="noopener">Check on leeds.gov.uk</a>');
  }
  const main = data.nextMain;
  const brown = data.nextBrown;
  const mainKind = main ? main.bin : 'black';
  let then = '';
  if (main) {
    const after = (data.upcoming || []).find((c) => c.date > main.date && (c.bin === 'black' || c.bin === 'green'));
    if (after) {
      const d = new Date(after.date + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
      then = '<p class="bin-then">Then the ' + BIN_INFO[after.bin].name.toLowerCase() + ' on ' + d + '</p>';
    }
  }
  /* Brown collections stop over the winter, so a long gap gets a word of explanation. */
  const brownNote = brown && daysFrom(data.today, brown.date) > 21 ? 'Back after the winter break' : '';
  const brownHtml = binCard('brown', brown, data.today, 'No collections in the next six months', brownNote);
  const title = main
    ? (daysFrom(data.today, main.date) <= 0 ? BIN_INFO[main.bin].name + ' today' : BIN_INFO[main.bin].name + ' next')
    : 'Bin day';
  const body = '<div class="bins">' + binCard(mainKind, main, data.today, 'No collections listed') + brownHtml + '</div>' + then;
  const foot = '<a href="' + escapeHtml(data.sourceUrl) + '" target="_blank" rel="noopener">Leeds City Council</a>'
    + ' &nbsp;·&nbsp; <button class="link-btn" type="button" onclick="showBinSetup()">Change address</button>';
  return '<div class="widget" id="binWidget"><div class="widget-label">Bin day</div>'
    + '<div class="widget-title">' + title + '</div>'
    + '<div class="widget-body">' + body + '</div>'
    + '<div class="widget-foot" style="color:var(--mid-grey)">' + foot + '</div></div>';
}

function binSetupHtml() {
  return '<div class="bin-setup">'
    + '<label for="binPostcode">Postcode — the council lists the addresses there, you pick yours.</label>'
    + '<div class="row"><input id="binPostcode" autocomplete="postal-code" placeholder="LS16 …" onkeydown="if(event.key===\'Enter\')findBinAddresses()">'
    + '<button type="button" onclick="findBinAddresses()">Find</button></div>'
    + '<div id="binChoice"></div>'
    + '<div class="bin-msg" id="binMsg"></div>'
    + '</div>';
}
function showBinSetup() {
  const w = document.getElementById('binWidget');
  if (!w) return;
  w.querySelector('.widget-body').innerHTML = binSetupHtml();
  const foot = w.querySelector('.widget-foot'); if (foot) foot.remove();
  w.querySelector('.widget-title').textContent = 'Change address';
}
async function findBinAddresses() {
  const msg = document.getElementById('binMsg');
  const pc = document.getElementById('binPostcode').value.trim();
  msg.textContent = 'Asking the council…';
  try {
    const res = await fetch('/admin/api/bins/addresses?postcode=' + encodeURIComponent(pc), { cache: 'no-store' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
    msg.textContent = '';
    document.getElementById('binChoice').innerHTML =
      '<div class="row"><select id="binAddress">' + data.map((a) => '<option value="' + escapeHtml(a.uprn) + '">' + escapeHtml(a.address) + '</option>').join('') + '</select></div>'
      + '<div class="row"><button type="button" onclick="saveBinAddress()">Use this address</button></div>';
  } catch (e) { msg.textContent = e.message; }
}
async function saveBinAddress() {
  const sel = document.getElementById('binAddress');
  const msg = document.getElementById('binMsg');
  msg.textContent = 'Saving…';
  try {
    const res = await fetch('/admin/api/bins/address', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ uprn: sel.value, address: sel.options[sel.selectedIndex].text }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
    await renderAdmin();
  } catch (e) { msg.textContent = e.message; }
}

async function loadBins() {
  try {
    const res = await fetch('/admin/api/bins', { cache: 'no-store' });
    if (res.status === 401) return null;
    const data = await res.json().catch(() => null);
    if (data && data.configured && !res.ok && !data.error) data.error = 'HTTP ' + res.status;
    return data;
  } catch (e) { return null; }
}
async function isSignedIn() {
  try {
    const res = await fetch('/api/session', { cache: 'no-store' });
    return res.ok && (await res.json()).signedIn === true;
  } catch (e) { return false; }
}

/* Bin day and the storage watch are only for the owner, so they are only
 * fetched — and the section only shown — when this browser is signed in. */
async function renderAdmin() {
  const [bins, storage] = await Promise.all([loadBins(), loadStorage()]);
  document.getElementById('adminGrid').innerHTML = [binsWidget(bins), storageWidget(storage)].join('');
  document.getElementById('adminSection').hidden = false;
}

/* ---- init ---- */
(async function init() {
  isSignedIn().then((yes) => { if (yes) renderAdmin(); });

  const [markets, recipeData] = await Promise.all([loadMarkets(), loadRecipeData()]);

  const now = new Date();
  const month = now.getMonth() + 1;
  const monthName = MONTH_NAMES[month - 1];

  const widgets = [
    marketsWidget(markets),
    seasonWidget(recipeData ? recipeData.seasonal : [], month, monthName, 'seasonal', 'In season'),
    seasonWidget(recipeData ? recipeData.foraging : [], month, monthName, 'foraging', 'Foraging'),
    festivalsWidget(markets),
  ].filter(Boolean);

  document.getElementById('dashGrid').innerHTML = widgets.join('');
})();
</script>
