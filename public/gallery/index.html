<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wildlife Photography — My Online Home</title>
<meta name="description" content="A wildlife photography portfolio — birds and animals of Yorkshire and further afield.">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0b;
    --bg-raised: #16150f;
    --text: #f1ede3;
    --text-dim: #a8a196;
    --text-faint: #6f6a60;
    --accent: #cc9c4c;
    --accent-soft: rgba(204,156,76,0.14);
    --line: rgba(241,237,227,0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  ::selection { background: var(--accent-soft); color: var(--text); }

  /* ---------- back-to-home ---------- */
  #mohome-back {
    position: fixed; top: 14px; left: 14px; z-index: 999;
    display: inline-block; padding: 7px 14px; border-radius: 999px;
    background: rgba(12,12,11,0.72); color: var(--text);
    font: 500 13px/1.2 'DM Sans', sans-serif; text-decoration: none;
    border: 1px solid rgba(241,237,227,0.18);
    backdrop-filter: blur(8px);
    transition: background .15s ease, border-color .15s ease;
  }
  #mohome-back:hover { background: rgba(12,12,11,0.92); border-color: var(--accent); }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    background: #000;
    overflow: hidden;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: 50% 45%;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .hero-bg.loaded { opacity: 1; }
  .hero::after {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(6,6,5,0.55) 0%, rgba(6,6,5,0.25) 30%, rgba(6,6,5,0.55) 70%, rgba(6,6,5,0.95) 100%);
  }
  .hero-inner { position: relative; z-index: 1; max-width: 46rem; }
  .hero-eyebrow {
    font-size: 0.72rem; letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--accent); font-weight: 500; margin-bottom: 1.1rem;
  }
  .hero h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(2.8rem, 8vw, 5.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.02;
    text-shadow: 0 4px 30px rgba(0,0,0,0.4);
  }
  .hero-role {
    margin-top: 0.9rem;
    font-size: clamp(0.95rem, 2vw, 1.15rem);
    letter-spacing: 0.06em;
    color: var(--text-dim);
    font-weight: 300;
  }
  .hero-tagline {
    margin-top: 1.4rem;
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-size: clamp(1rem, 2.2vw, 1.25rem);
    color: var(--text-dim);
    max-width: 34rem;
    margin-left: auto; margin-right: auto;
  }
  .hero-link {
    display: inline-block; margin-top: 1.6rem; padding: 0.55rem 1.3rem;
    border: 1px solid rgba(204,156,76,0.55); border-radius: 999px;
    color: var(--accent); text-decoration: none; font-size: 0.9rem; letter-spacing: 0.02em;
    background: rgba(0,0,0,0.25); backdrop-filter: blur(4px);
    transition: background 0.15s, color 0.15s;
  }
  .hero-link:hover { background: var(--accent); color: #111; }
  .hero-scroll {
    position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
    z-index: 1; color: var(--text-dim); opacity: 0.75;
    animation: bob 2.2s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translate(-50%,0); } 50% { transform: translate(-50%,8px); } }

  /* ---------- filter bar ---------- */
  .filter-bar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(12,12,11,0.86);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 0 1.5rem;
  }
  .filter-bar-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; gap: 0.5rem;
    height: 56px; overflow-x: auto; scrollbar-width: none;
  }
  .filter-bar-inner::-webkit-scrollbar { display: none; }
  .filter-pill {
    background: none; border: 1px solid transparent; color: var(--text-dim);
    font-family: 'DM Sans', sans-serif; font-size: 0.78rem; letter-spacing: 0.04em;
    text-transform: uppercase; font-weight: 500;
    padding: 6px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .filter-pill:hover { color: var(--text); }
  .filter-pill.active { color: var(--bg); background: var(--accent); }
  .filter-count {
    margin-left: auto; font-size: 0.72rem; color: var(--text-faint);
    letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; padding-left: 1rem;
  }

  /* ---------- gallery grid ---------- */
  /* Big tiles: three across on a wide screen, two on a laptop, one on a phone.
   * Each photo has a focus point (the subject), and placeFocus() below slides
   * the crop so that point sits in the middle of the tile wherever it can. */
  .gallery-wrap { max-width: 1680px; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(440px, 100%), 1fr));
    grid-auto-flow: dense;
    gap: 8px;
  }
  .tile {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    cursor: pointer;
    background: var(--bg-raised);
  }
  .tile.wide { aspect-ratio: 2 / 1; grid-column: span 2; }
  @media (max-width: 960px) { .tile.wide { grid-column: span 1; aspect-ratio: 1 / 1; } }
  @media (max-width: 640px) { .gallery-wrap { padding: 1.5rem 0.75rem 4rem; } .grid { gap: 6px; } }
  .tile img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .6s cubic-bezier(.2,.7,.3,1), filter .6s ease;
    filter: saturate(0.96);
    object-position: 50% 50%;
  }
  .tile:hover img { transform: scale(1.06); }
  .tile-veil {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(6,6,5,0) 45%, rgba(6,6,5,0.88) 100%);
    opacity: 0; transition: opacity .3s ease;
  }
  .tile:hover .tile-veil { opacity: 1; }
  .tile-caption {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 1.1rem 1.1rem 1rem;
    transform: translateY(10px); opacity: 0; transition: transform .3s ease, opacity .3s ease;
  }
  .tile:hover .tile-caption { transform: translateY(0); opacity: 1; }
  @media (hover: none) {
    .tile-veil { opacity: 1; background: linear-gradient(180deg, rgba(6,6,5,0) 65%, rgba(6,6,5,0.8) 100%); }
    .tile-caption { transform: none; opacity: 1; }
  }
  .tile-title {
    font-family: 'Playfair Display', Georgia, serif; font-size: 1.05rem; font-weight: 600;
  }
  .tile-species {
    font-size: 0.74rem; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--accent); margin-top: 0.2rem;
  }
  .empty-state {
    text-align: center; padding: 5rem 1rem; color: var(--text-faint);
    font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 1.1rem;
  }

  /* ---------- lightbox ---------- */
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 500;
    background: var(--bg);
    padding: 4vh 2rem; overflow-y: auto;
  }
  .lightbox.open { display: block; }
  .lightbox-inner {
    max-width: 1560px; margin: 0 auto;
    display: grid; grid-template-columns: 1fr 300px; gap: 2.5rem; align-items: start;
  }
  @media (max-width: 860px) { .lightbox-inner { grid-template-columns: 1fr; } }
  .lightbox-img-wrap { position: relative; }
  .lightbox-img-wrap img {
    width: 100%; height: auto; max-height: 90vh; object-fit: contain; display: block; background: #000;
  }
  .lightbox-meta { padding-top: 0.5rem; }
  .lightbox-species {
    font-size: 0.76rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 500;
  }
  .lightbox-title {
    font-family: 'Playfair Display', Georgia, serif; font-size: 1.9rem; font-weight: 700;
    margin-top: 0.4rem; line-height: 1.15;
  }
  .lightbox-facts { margin-top: 1rem; font-size: 0.82rem; color: var(--text-dim); }
  .lightbox-facts div { padding: 0.3rem 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 1rem; }
  .lightbox-facts div:last-child { border-bottom: none; }
  .lightbox-facts span:first-child { color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.7rem; }
  .lightbox-caption {
    margin-top: 1.2rem; font-family: 'Playfair Display', Georgia, serif; font-style: italic;
    color: var(--text-dim); font-size: 0.98rem; line-height: 1.7;
  }
  .lightbox-close, .lightbox-nav {
    position: fixed; z-index: 510; background: rgba(20,19,15,0.6); color: var(--text);
    border: 1px solid var(--line); border-radius: 50%; width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .lightbox-close:hover, .lightbox-nav:hover { background: rgba(204,156,76,0.18); border-color: var(--accent); }
  .lightbox-close { top: 18px; right: 18px; }
  .lightbox-nav.prev { left: 18px; top: 50%; transform: translateY(-50%); }
  .lightbox-nav.next { right: 18px; top: 50%; transform: translateY(-50%); }
  @media (max-width: 640px) { .lightbox-nav { display: none; } }

  /* ---------- footer ---------- */
  footer {
    border-top: 1px solid var(--line);
    padding: 2.5rem 1.5rem 3rem;
    text-align: center;
  }
  footer .footer-contact { font-size: 0.82rem; color: var(--text-faint); }
  footer .footer-contact a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(204,156,76,0.35); }
  footer .footer-contact a:hover { border-bottom-color: var(--accent); }
</style>
</head>

const TAG_LABELS = {
  'birds-of-prey': 'Birds of Prey',
  'seabirds': 'Seabirds',
  'waders': 'Waders & Waterfowl',
  'mammals': 'Mammals',
  'garden-birds': 'Garden Birds',
  'songbirds': 'Songbirds',
  'reptiles': 'Reptiles',
  'invertebrates': 'Invertebrates',
};

let GALLERY = PHOTOS.slice();   // PHOTOS plus anything uploaded on the site, minus anything removed
let activeTag = 'all';
let lightboxIndex = -1;

function tagLabel(t) { return TAG_LABELS[t] || (t.charAt(0).toUpperCase() + t.slice(1).replace(/-/g, ' ')); }

function filteredPhotos() {
  if (activeTag === 'all') return GALLERY;
  return GALLERY.filter(p => p.tags && p.tags.includes(activeTag));
}

function renderFilterBar() {
  const tagSet = new Set();
  GALLERY.forEach(p => (p.tags || []).forEach(t => tagSet.add(t)));
  const tags = ['all', ...Array.from(tagSet)];
  const bar = document.getElementById('filterBar');
  bar.innerHTML = tags.map(t => {
    const label = t === 'all' ? 'All Photos' : tagLabel(t);
    const count = t === 'all' ? GALLERY.length : GALLERY.filter(p => p.tags && p.tags.includes(t)).length;
    return '<button class="filter-pill' + (activeTag === t ? ' active' : '') + '" onclick="setTag(\'' + t + '\')">' + label + '</button>';
  }).join('') + '<span class="filter-count">' + filteredPhotos().length + ' of ' + GALLERY.length + '</span>';
}

function setTag(t) { activeTag = t; renderFilterBar(); renderGrid(); }

function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function renderGrid() {
  const list = filteredPhotos();
  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = '<div class="empty-state">No photographs in this collection yet.</div>';
    return;
  }
  grid.innerHTML = list.map(p => {
    const idx = GALLERY.indexOf(p);
    return '<div class="tile' + (p.size === 'wide' ? ' wide' : '') + '" onclick="openLightbox(' + idx + ')">'
      + '<img src="' + escapeHtml(p.src) + '" alt="' + escapeHtml(p.title) + (p.species ? ' — ' + escapeHtml(p.species) : '') + '" loading="lazy" data-focus="' + escapeHtml(p.focus || '') + '" onload="placeFocus(this)">'
      + '<div class="tile-veil"></div>'
      + '<div class="tile-caption"><div class="tile-title">' + escapeHtml(p.title) + '</div><div class="tile-species">' + escapeHtml(p.species) + '</div></div>'
      + '</div>';
  }).join('');
}

function renderLightbox() {
  const p = GALLERY[lightboxIndex];
  if (!p) return;
  const facts = [];
  if (p.location) facts.push(['Location', p.location]);
  if (p.date) facts.push(['Date', p.date]);
  if (p.camera) facts.push(['Camera', p.camera]);
  const factsHtml = facts.length
    ? '<div class="lightbox-facts">' + facts.map(f => '<div><span>' + escapeHtml(f[0]) + '</span><span>' + escapeHtml(f[1]) + '</span></div>').join('') + '</div>'
    : '';
  document.getElementById('lightboxInner').innerHTML =
    '<div class="lightbox-img-wrap"><img src="' + escapeHtml(p.src) + '" alt="' + escapeHtml(p.title) + '"></div>'
    + '<div class="lightbox-meta">'
    + '<div class="lightbox-species">' + escapeHtml(p.species) + '</div>'
    + '<h2 class="lightbox-title">' + escapeHtml(p.title) + '</h2>'
    + factsHtml
    + '<p class="lightbox-caption">' + escapeHtml(p.caption || '') + '</p>'
    + '</div>';
}

function openLightbox(idx) {
  lightboxIndex = idx;
  renderLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
function stepLightbox(delta) {
  const list = filteredPhotos();
  const currentId = GALLERY[lightboxIndex].id;
  const posInFiltered = list.findIndex(p => p.id === currentId);
  const nextPos = (posInFiltered + delta + list.length) % list.length;
  lightboxIndex = GALLERY.indexOf(list[nextPos]);
  renderLightbox();
}

document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target.id === 'lightbox') closeLightbox();
});
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') stepLightbox(-1);
  if (e.key === 'ArrowRight') stepLightbox(1);
});

// =============================================
// HERO
// =============================================
let heroImg = null;
function initHero() {
  const heroPhoto = GALLERY.find(p => p.hero) || GALLERY[0];
  if (!heroPhoto) return;
  const bg = document.getElementById('heroBg');
  if (heroImg && heroImg.dataset.src === heroPhoto.src) return;
  bg.style.backgroundImage = "url('" + heroPhoto.src + "')";
  const img = new Image();
  img.dataset.src = heroPhoto.src;
  img.dataset.focus = heroPhoto.focus || '';
  img.onload = () => { heroImg = img; placeHeroFocus(); bg.classList.add('loaded'); };
  img.src = heroPhoto.src;
}

// =============================================
// CROPPING AROUND THE SUBJECT
// =============================================
/* Each photo's `focus` is where its subject is, as "x% y%" of the full frame.
 * A cropped tile (object-fit: cover) shows a window onto the photo; this works
 * out where that window has to sit for the subject to land in the middle of
 * the tile, and clamps it so the window never runs off the edge of the photo.
 * Plain CSS object-position: x% y% doesn't do this — it lines up x% of the
 * photo with x% of the tile, which leaves an off-centre subject off-centre. */
function parseFocus(f) {
  const m = /^\s*([\d.]+)%?\s+([\d.]+)%?\s*$/.exec(f || '');
  return m ? [Math.min(100, +m[1]) / 100, Math.min(100, +m[2]) / 100] : [0.5, 0.5];
}
function cropPosition(nw, nh, bw, bh, focus) {
  if (!nw || !nh || !bw || !bh) return '50% 50%';
  const [fx, fy] = parseFocus(focus);
  const scale = Math.max(bw / nw, bh / nh);
  const axis = (natural, box, f) => {
    const shown = natural * scale;
    if (shown - box < 1) return 50;
    const p = (f * shown - box / 2) / (shown - box);
    return Math.round(Math.max(0, Math.min(1, p)) * 1000) / 10;
  };
  return axis(nw, bw, fx) + '% ' + axis(nh, bh, fy) + '%';
}
function placeFocus(img) {
  img.style.objectPosition = cropPosition(img.naturalWidth, img.naturalHeight, img.clientWidth, img.clientHeight, img.dataset.focus);
}
function placeHeroFocus() {
  if (!heroImg) return;
  const bg = document.getElementById('heroBg');
  bg.style.backgroundPosition = cropPosition(heroImg.naturalWidth, heroImg.naturalHeight, bg.clientWidth, bg.clientHeight, heroImg.dataset.focus);
}
let refocusTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(refocusTimer);
  refocusTimer = setTimeout(() => {
    document.querySelectorAll('#grid img').forEach(img => { if (img.complete) placeFocus(img); });
    placeHeroFocus();
  }, 120);
});

// =============================================
// PHOTOS ADDED AND REMOVED ON THE SITE
// =============================================
/* /admin/photos/ uploads photos to the database and removes ones from this
 * page. /api/gallery returns both, and the last answer is kept on this
 * device so a removed photo doesn't flash up before the network replies. */
const GALLERY_CACHE = 'gallery.overlay.v1';
function applyOverlay(o) {
  if (!o || !Array.isArray(o.added)) return;
  const gone = new Set((o.removed || []).map(r => r.id));
  const seedIds = new Set(PHOTOS.map(p => p.id));
  GALLERY = o.added.filter(p => !seedIds.has(p.id)).concat(PHOTOS).filter(p => !gone.has(p.id));
}
try { applyOverlay(JSON.parse(localStorage.getItem(GALLERY_CACHE) || 'null')); } catch (e) {}

initHero();
renderFilterBar();
renderGrid();

fetch('/api/gallery', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : null)
  .then(o => {
    if (!o || !Array.isArray(o.added)) return;
    try { localStorage.setItem(GALLERY_CACHE, JSON.stringify(o)); } catch (e) {}
    const before = GALLERY.map(p => p.id).join('|');
    applyOverlay(o);
    if (GALLERY.map(p => p.id).join('|') === before) return;
    if (activeTag !== 'all' && !GALLERY.some(p => (p.tags || []).includes(activeTag))) activeTag = 'all';
    initHero();
    renderFilterBar();
    renderGrid();
  })
  .catch(() => { /* offline — the photos in this file are enough */ });
</script>
