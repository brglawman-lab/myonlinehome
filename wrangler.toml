# Cloudflare Worker config. `npx wrangler deploy` (the deploy command set in the
# dashboard) reads this file on every push.
#
# This project is a Worker with static assets — NOT a classic Pages project.
# That means there is no "build output directory" setting and the Pages
# `functions/` convention does not apply. Routing lives in src/index.js.

name = "myonlinehome"
main = "src/index.js"
compatibility_date = "2026-08-26"

# Serve only on myonlinehome.co.uk (and www). Without these, the Worker is also
# public at myonlinehome.<account>.workers.dev and on per-version preview URLs,
# which sit outside any protection set up for the real domain.
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# /admin/ is the signed-in area, so the Worker checks the session before any
# of its files are served. With a list here, paths NOT on it never reach the
# Worker at all (a missing file just gets the 404 page), so the API prefixes
# and the old /private/ addresses (redirected to /admin/) must be listed too.
# /recipes/benicity is listed only so the Worker can redirect the old public
# address to /admin/benicity/.
run_worker_first = ["/admin/*", "/api/*", "/private/*", "/recipes/benicity", "/recipes/benicity/*"]

# Everything else is served straight from ./public.

# Workers AI — used by the shopping list's microphone (speech to text).
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "myonlinehome"
database_id = "affffb62-0294-4017-817a-c53635ce9cb2"
